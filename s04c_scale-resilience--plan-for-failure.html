<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=1280, H=720; let dpr=1;
function resize(){ dpr=Math.min(window.devicePixelRatio||1,2); cv.width=W*dpr; cv.height=H*dpr; }
resize(); addEventListener('resize', resize);

const C={white:'#ECECEC',grey:'#7d7d7d',dim:'#444',blue:'#58C4DD',yellow:'#F7D96F',green:'#83C167',red:'#FC6255',teal:'#5CD0B3',purple:'#B189C6',orange:'#FF9A4D'};
const TEAMS=['HR','FINANCE','IT','ESTATES'], TCOL=[C.purple,C.yellow,C.blue,C.orange];
const SERIF='Georgia, "Times New Roman", serif', MONO='Consolas, "SFMono-Regular", "Liberation Mono", monospace';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const smooth=x=>{x=clamp(x);return x*x*(3-2*x);};
const P=(t,s,d)=>smooth((t-s)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ---------- drawing helpers ---------- */
const fontStr=(size,font,style)=>[style,size+'px',font].filter(Boolean).join(' ');
function txt(s,x,y,o={}){
  const {size=28,color=C.white,align='center',alpha=1,font=SERIF,style='',p=1}=o;
  if(alpha<=0||p<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.font=fontStr(size,font,style); ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='middle';
  if(p<1){ const w=ctx.measureText(s).width, x0=align==='center'?x-w/2:align==='right'?x-w:x; ctx.beginPath(); ctx.rect(x0-4,y-size,(w+8)*p,size*2); ctx.clip(); }
  ctx.fillText(s,x,y); ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function box(x,y,w,h,o={}){
  const {stroke=C.white,fill=null,alpha=1,lw=2,r=10,p=1,dash=null}=o; if(alpha<=0||p<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; rr(x,y,w,h,r); if(fill){ctx.fillStyle=fill;ctx.fill();}
  const L=2*(w+h); if(p<1) ctx.setLineDash([L*p,L]); else if(dash) ctx.setLineDash(dash);
  ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.stroke(); ctx.restore();
}
function rect(x,y,w,h,color,alpha=1){ if(alpha<=0||w<=0) return; ctx.save(); ctx.globalAlpha*=alpha; ctx.fillStyle=color; ctx.fillRect(x,y,w,h); ctx.restore(); }
function seg(x1,y1,x2,y2,o={}){
  const {color=C.white,lw=2,alpha=1,p=1,dash=null}=o; if(p<=0||alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineCap='round'; if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(lerp(x1,x2,p),lerp(y1,y2,p)); ctx.stroke(); ctx.restore();
}
function arrow(x1,y1,x2,y2,o={}){
  const {color=C.white,p=1,alpha=1,lw=2.2,head=10}=o; if(p<=0||alpha<=0) return;
  seg(x1,y1,x2,y2,{color,lw,alpha,p,dash:o.dash});
  const x=lerp(x1,x2,p), y=lerp(y1,y2,p), a=Math.atan2(y2-y1,x2-x1);
  ctx.save(); ctx.globalAlpha*=alpha; ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(x,y);
  ctx.lineTo(x-head*Math.cos(a-.4),y-head*Math.sin(a-.4)); ctx.lineTo(x-head*Math.cos(a+.4),y-head*Math.sin(a+.4)); ctx.closePath(); ctx.fill(); ctx.restore();
}
function dot(x,y,r,color,alpha=1){ if(alpha<=0) return; ctx.save(); ctx.globalAlpha*=alpha; ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.restore(); }
function ring(x,y,r,color,alpha=1,lw=2){ if(alpha<=0) return; ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke(); ctx.restore(); }
function arc(x,y,r,f,color,alpha=1,lw=2.5){ if(alpha<=0) return; ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.beginPath(); ctx.arc(x,y,r,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(f)); ctx.stroke(); ctx.restore(); }
function spinner(x,y,r,t,color,alpha=1){ if(alpha<=0) return; ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.lineWidth=3; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(x,y,r,t*6,t*6+4.2); ctx.stroke(); ctx.restore(); }
function poly(pts,o={}){ const {color=C.white,lw=2.5,alpha=1}=o; if(alpha<=0||pts.length<2) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineJoin='round'; ctx.beginPath(); pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.stroke(); ctx.restore(); }
function person(x,y,col,a){ if(a<=0) return; ring(x,y-16,11,col,a,2.5); ctx.save(); ctx.globalAlpha*=a; ctx.strokeStyle=col; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(x,y+22,20,Math.PI,0); ctx.stroke(); ctx.restore(); }
function cylinder(cx,cy,w,h,color,a){
  if(a<=0) return; ctx.save(); ctx.globalAlpha*=a; ctx.strokeStyle=color; ctx.lineWidth=2; ctx.fillStyle='rgba(0,0,0,.92)';
  ctx.beginPath(); ctx.ellipse(cx,cy+h/2,w/2,10,0,0,Math.PI); ctx.lineTo(cx-w/2,cy-h/2); ctx.ellipse(cx,cy-h/2,w/2,10,0,Math.PI,0,true); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx,cy-h/2,w/2,10,0,0,Math.PI*2); ctx.stroke(); ctx.restore();
}
function tag(x,y,s,col,a,size=14){ if(a<=0) return; ctx.save(); ctx.font=fontStr(size,MONO,''); const w=ctx.measureText(s).width+20; ctx.restore();
  box(x-w/2,y-size,w,size*2,{stroke:col,fill:'rgba(0,0,0,.92)',alpha:a,r:6}); txt(s,x,y,{size,font:MONO,color:col,alpha:a}); }

/* ======================================================================
   FAILURE SIMULATOR (deterministic, seekable)
   ====================================================================== */
const DT=.02;
class FailSim{
  constructor(cfg){ this.cfg=cfg; this.reset(); }
  reset(){ this.t=0; this.rng=mulberry32(this.cfg.seed||7); this.tk=[]; this.jobs=[]; this.id=0; this.next=this.gap(0);
    this.out={team:0,human:0,lost:0}; this.log=[]; this.calls=[]; this.wasted=0; this.failStart=null; this.alertAt=null; this.alert=false; }
  gap(t){ return t-Math.log(1-this.rng())/this.cfg.lambda(t); }
  used(){ let n=0; for(const k of this.tk) if(k.slot) n++; return n; }
  call(k,t){ k.st='calling'; k.callT=t; k.att++; this.jobs.push({k,att:k.att,st:'q',end:0}); this.calls.push(t); }
  finish(k,t,kind,reason){ k.slot=false; k.st=kind; k.t0=t; k.reason=reason; }
  step(dt){
    const c=this.cfg, t=this.t+dt, mode=c.mode(t), SL=c.slots||12;
    if(mode!=='healthy'){ if(this.failStart==null) this.failStart=t; } else { this.failStart=null; this.alertAt=null; }
    while(this.next<=t){ this.tk.push({id:this.id++,st:'in',t0:this.next,arr:this.next,att:0,slot:false,team:Math.floor(this.rng()*4)}); this.next=this.gap(this.next); }
    const to=c.timeout(t), rt=c.retries(t), bo=c.backoff(t), fb=c.fallback(t);
    for(const k of this.tk){
      if(k.st==='in'){ if(t-k.t0>=.6){ k.saved=fb; if(this.used()>=SL) this.finish(k,t,fb?'toHuman':'toLost',fb?'overload':'refused'); else { k.slot=true; this.call(k,t); } } }
      else if(k.st==='calling'){ if(to>0&&t-k.callT>to){ if(k.att<=rt){ k.st='backoff'; k.until=t+(bo?.6*Math.pow(2,k.att-1)*(.5+this.rng()):.05); } else this.finish(k,t,fb?'toHuman':'toLost',fb?'failed':'timeout'); } }
      else if(k.st==='backoff'){ if(t>=k.until) this.call(k,t); }
      else if(k.st==='toTeam'||k.st==='toHuman'||k.st==='toLost'){ if(t-k.t0>=.8){ const kind=k.st==='toTeam'?'team':k.st==='toHuman'?'human':'lost'; this.out[kind]++; this.log.push({t,kind,reason:k.reason,wait:k.t0-k.arr}); k.st='done'; } }
    }
    if(mode!=='down'){
      const st=mode==='healthy'?.35:3.5; let busy=0; for(const j of this.jobs) if(j.st==='s') busy++;
      for(const j of this.jobs){ if(j.st==='s'&&t>=j.end){ j.st='done'; busy--; const k=j.k;
          if(k.st==='calling'&&k.att===j.att){ const unsure=this.rng()<.15; this.finish(k,t,unsure?'toHuman':'toTeam',unsure?'unsure':'ok'); } else this.wasted++; } }
      for(const j of this.jobs){ if(busy>=4) break; if(j.st==='q'){ j.st='s'; j.end=t+st*(.8+.4*this.rng()); busy++; } }
    }
    this.jobs=this.jobs.filter(j=>j.st!=='done'); if(this.jobs.length>500) this.jobs.splice(0,this.jobs.length-500);
    this.tk=this.tk.filter(k=>k.st!=='done'); this.log=this.log.filter(e=>e.t>t-15); this.calls=this.calls.filter(x=>x>t-5);
    const recent=this.log.filter(e=>e.t>t-8), bad=recent.filter(e=>['failed','timeout','refused','overload'].includes(e.reason)).length;
    let oldest=0; for(const k of this.tk) if(k.st==='calling'||k.st==='backoff') oldest=Math.max(oldest,t-k.arr);
    this.alert=(recent.length>=4&&bad/recent.length>.25)||oldest>4;
    if(this.alert&&this.failStart!=null&&this.alertAt==null) this.alertAt=t;
    this.t=t;
  }
  waitingNow(){ return this.tk.filter(k=>k.st==='calling'||k.st==='backoff').length; }
  advanceTo(T){ while(this.t+DT<=T+1e-9) this.step(DT); }
}
function syncF(s,t){ if(t<s.t-1e-6) s.reset(); s.advanceTo(t); }

const TEAMY=[180,225,270,315], HUMAN=[1135,410], LOST=[1135,530];
function drawFail(s,a=1,o={}){
  const t=s.t, mode=s.cfg.mode(t), SL=s.cfg.slots||12, used=s.used();
  for(let i=0;i<5;i++) ring(90,270+i*30,9,C.blue,a);
  txt('Staff',90,440,{size:17,style:'italic',color:C.grey,alpha:a});
  box(320,180,280,290,{stroke:used>=SL?C.red:C.teal,alpha:a}); txt('API',460,207,{size:20,alpha:a});
  const inSlot=s.tk.filter(k=>k.slot);
  for(let i=0;i<SL;i++){ const cx=365+(i%4)*63, cy=258+Math.floor(i/4)*58;
    box(cx-22,cy-22,44,44,{stroke:'#33333b',alpha:a,r:6}); const k=inSlot[i];
    if(k){ if(k.st==='calling') spinner(cx,cy,11,t+i*.3,t-k.arr>3?C.red:C.yellow,a); else if(k.st==='backoff') { arc(cx,cy,11,(t-(k.until-1))/1,C.orange,a,2); txt('⏸',cx,cy,{size:14,color:C.orange,alpha:a}); } } }
  txt(`slots in use ${used}/${SL}`,460,440,{size:14,font:MONO,color:used>=SL?C.red:C.grey,alpha:a});
  const mc=mode==='healthy'?C.teal:mode==='slow'?C.orange:C.red;
  arrow(602,330,756,330,{color:mc,alpha:a});
  box(760,240,200,180,{stroke:mc,lw:mode==='healthy'?2:3,alpha:a});
  txt('model',860,275,{size:20,alpha:a});
  txt(mode==='healthy'?'healthy':mode==='slow'?'slow (3.5 s)':'✗ down · no answer',860,308,{size:15,font:MONO,color:mc,alpha:a});
  const q=s.jobs.filter(j=>j.st==='q').length;
  txt(`queued calls ${q}`,860,345,{size:13,font:MONO,color:C.grey,alpha:a});
  txt(`calls/s ${(s.calls.length/5).toFixed(1)}`,860,370,{size:13,font:MONO,color:C.grey,alpha:a});
  if(o.labels!==false){
    txt('team queues',1140,150,{size:14,font:MONO,color:C.grey,alpha:a});
    TEAMS.forEach((tm,i)=>{ box(1060,TEAMY[i]-17,160,34,{stroke:TCOL[i],alpha:a,r:6}); txt(tm,1140,TEAMY[i],{size:13,font:MONO,color:TCOL[i],alpha:a}); });
    box(1040,380,190,60,{stroke:C.yellow,alpha:a}); txt('human queue',1135,400,{size:16,color:C.yellow,alpha:a}); txt(String(s.out.human),1135,423,{size:14,font:MONO,color:C.yellow,alpha:a});
    box(1040,500,190,60,{stroke:C.red,alpha:a}); txt('lost / error',1135,520,{size:16,color:C.red,alpha:a}); txt(String(s.out.lost),1135,543,{size:14,font:MONO,color:C.red,alpha:a});
  }
  if(o.store){ arrow(460,472,460,505,{color:C.green,alpha:a}); cylinder(460,535,170,46,C.green,a); txt('tickets saved',460,535,{size:14,color:C.green,alpha:a}); }
  for(const k of s.tk){
    let x,y,col=C.blue,al=a;
    if(k.st==='in'){ const u=smooth((t-k.t0)/.6), sy=270+((k.id*37)%5)*30; x=lerp(102,320,u); y=lerp(sy,330,u); }
    else if(k.st==='toTeam'||k.st==='toHuman'||k.st==='toLost'){
      const u=smooth((t-k.t0)/.8), from=(k.reason==='refused'||k.reason==='overload')?[330,330]:[600,330];
      const to=k.st==='toTeam'?[1060,TEAMY[k.team]]:k.st==='toHuman'?[1040,HUMAN[1]]:[1040,LOST[1]];
      x=lerp(from[0],to[0],u); y=lerp(from[1],to[1],u)+Math.sin(u*Math.PI)*(k.st==='toLost'?40:0);
      col=k.st==='toTeam'?TCOL[k.team]:k.st==='toHuman'?C.yellow:C.red;
    } else continue;
    dot(x,y,5,col,al);
  }
  if(o.alert&&s.alert) tag(860,205,'🔔 ALERT · on-call paged',C.red,a*(.75+.25*Math.sin(t*8)),14);
  if(o.stats){
    box(80,600,1120,96,{stroke:'#2c2c33',fill:'rgba(8,8,11,.9)',alpha:a});
    const cols=[['routed by model',s.out.team,C.green],['human queue',s.out.human,C.yellow],['lost / error',s.out.lost,C.red],['staff waiting now',s.waitingNow(),s.waitingNow()>8?C.red:C.white],['wasted model work',s.wasted,C.orange]];
    cols.forEach(([l,v,c],i)=>{ const x=192+i*224; txt(l,x,628,{size:14,style:'italic',color:C.grey,alpha:a}); txt(String(v),x,664,{size:26,font:MONO,color:c,alpha:a}); });
  }
}

/* ======================================================================
   SCENES
   ====================================================================== */
const naive=x=>x<10?3:x<11?lerp(3,12,x-10):x<14?12:3+9*Math.exp(-(x-14)/9);
const g=(x,m,s)=>Math.exp(-((x-m)**2)/(2*s*s));
const polite=x=>3+1.3*g(x,11,.45)+1.1*g(x,12.6,.7)+.9*g(x,15,1.1);

const S=[
/* 1 ─ 10:15 */
{title:'10:15',dur:24,
 sim:new FailSim({seed:3,lambda:()=>3,mode:t=>t<2?'healthy':'down',timeout:()=>0,retries:()=>0,backoff:()=>false,fallback:()=>false}),
 caps:[[0,"Imagine this. It's 10:15 on a busy morning, and the model service crashes."],
       [6,"Tickets are still arriving. Without a plan, each request waits for an answer that never comes."],
       [12.5,"Staff stare at spinners. Some give up. Some tickets are simply lost."],
       [17.5,"Resilience doesn't mean nothing ever fails. It means the system has a plan for failure."]],
 draw(t){

  if(D.mode!=='healthy'&&drill.failStart!=null){
    const since=(drill.t-drill.failStart).toFixed(0);
    msg.push(drill.alertAt!=null?`alert raised ${(drill.alertAt-drill.failStart).toFixed(1)} s after the failure began`:`failure began ${since} s ago · no alert yet`);
  }
  if(D.to===0&&D.mode==='down') msg.push('no timeout: slots never free up');
  if(!D.fb&&drill.out.lost>0) msg.push('no fallback: tickets are being lost');
  if(!D.bo&&D.rt>0&&D.mode==='slow') msg.push('instant retries pile extra work onto a slow model');
  msg.forEach((m,i)=>txt(m,640,92+i*26,{size:17,style:'italic',color:i===0&&drill.alertAt!=null?C.yellow:C.red}));
}

/* ======================================================================
   PLAYER
   ====================================================================== */
const START=[]; let TOTAL=0; S.forEach(s=>{START.push(TOTAL); TOTAL+=s.dur;});
let T=0, playing=false, lastTs=null, voiceOn=false, capKey=null, explore=false, frameDt=0;
const capEl=$('cap'), fillEl=$('fill'), timeEl=$('time'), playBtn=$('play'), bigPlay=$('bigplay'), voiceBtn=$('voice'), exBtn=$('exploreBtn');
S.forEach((s,i)=>{
  if(i>0){ const tk=document.createElement('div'); tk.className='tick'; tk.style.left=(START[i]/TOTAL*100)+'%'; $('bar').appendChild(tk); }
  const b=document.createElement('button'); b.textContent=`${i+1} · ${s.title}`;
  b.onclick=()=>{ setExplore(false); seek(START[i]+.001); if(!playing) setPlaying(true); };
  $('chapters').appendChild(b);
});
const chapBtns=[...$('chapters').children];
const locate=time=>{ for(let i=S.length-1;i>=0;i--) if(time>=START[i]) return {i,lt:Math.min(time-START[i],S[i].dur)}; return {i:0,lt:0}; };
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
/* ---------- NARRATOR: every word is spoken before the video moves on ---------- */
const SAY=[[/“|”|"/g,''],[/TF-IDF/g,'T F I D F'],[/\b2xx\b/g,'two hundreds'],[/\b4xx\b/g,'four hundreds'],[/\b5xx\b/g,'five hundreds'],
  [/HUMAN_REVIEW/g,'human review'],[/\bFINANCE\b/g,'Finance'],[/\bESTATES\b/g,'Estates'],[/\bIT\b/g,'I T'],[/\bHR\b/g,'H R'],
  [/\bCCIO\b/g,'C C I O'],[/(\d{2}):(\d{2})/g,(m,h,mi)=>`${+h} ${mi==='00'?"o'clock":mi}`],[/7f3a/g,'7 F 3 A'],[/\//g,' slash ']];
const NAR={u:null,speaking:false,until:0,voice:null,list:[]};
const HOLDS=[]; S.forEach((s,i)=>{ s.caps.forEach((c,k)=>{ if(k>0) HOLDS.push(START[i]+c[0]-.02); }); HOLDS.push(START[i]+s.dur-.6); }); HOLDS.sort((a,b)=>a-b);
const vSel=document.createElement('select'); vSel.title='Narrator voice';
vSel.style.cssText='background:#16161a;border:1px solid #2a2a30;color:#ddd;border-radius:8px;height:36px;padding:0 8px;font-family:inherit;font-size:13px;max-width:200px';
voiceBtn.after(vSel);
const vNorm=l=>(l||'').replace('_','-');
const vRank=v=>{ const l=vNorm(v.lang); return /^en-GB/i.test(l)?0:/^en-US/i.test(l)?1:/^en/i.test(l)?2:9; };
const vGood=v=>/natural|online|google|neural|premium|enhanced/i.test(v.name)?1:0;
const vName=v=>v.name.replace(/^(Microsoft|Google|Apple) /,'').replace(/\s*-\s*English.*$/,'').slice(0,34);
function pickVoices(){
  if(!('speechSynthesis' in window)) return;
  const vs=speechSynthesis.getVoices().filter(v=>vRank(v)<9).sort((a,b)=>vRank(a)-vRank(b)||vGood(b)-vGood(a));
  if(!vs.length) return;
  NAR.list=vs; vSel.innerHTML='';
  const label={0:'🇬🇧 UK English',1:'🇺🇸 US English',2:'Other English'}; let g=null, og=null;
  vs.forEach((v,i)=>{
    const r=vRank(v);
    if(r!==g){ g=r; og=document.createElement('optgroup'); og.label=label[r]; vSel.appendChild(og); }
    const o=document.createElement('option'); o.value=i; o.textContent=vName(v)+' · '+vNorm(v.lang); og.appendChild(o);
  });
  if(!vs.some(v=>vRank(v)===0)){
    const og2=document.createElement('optgroup'); og2.label='No UK voice on this device';
    const o=document.createElement('option'); o.value='help'; o.textContent='➕ How to add a UK English voice'; og2.appendChild(o); vSel.appendChild(og2);
  }
  const cur=NAR.voice?vs.findIndex(v=>v.name===NAR.voice.name):-1, i=cur>=0?cur:0;
  vSel.value=String(i); NAR.voice=vs[i];
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=pickVoices; pickVoices(); [300,1200,3500].forEach(ms=>setTimeout(pickVoices,ms)); }
else vSel.style.display='none';
vSel.onchange=()=>{
  if(vSel.value==='help'){
    capEl.textContent='To add a UK voice — Windows: Settings → Time & language → Speech → Add voices → English (United Kingdom). Mac: System Settings → Accessibility → Spoken Content → System voice → Manage Voices → English (UK). Or open this page in Microsoft Edge or Google Chrome, which include free UK voices. Then reload the page.';
    vSel.value=String(Math.max(0,NAR.list.indexOf(NAR.voice))); return;
  }
  NAR.voice=NAR.list[+vSel.value]; stopVoice(); capKey=null;
};
function speak(s){
  if(!voiceOn||!playing||!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const text=SAY.reduce((a,[r,v])=>a.replace(r,v),s);
  const u=new SpeechSynthesisUtterance(text);
  if(NAR.voice){ u.voice=NAR.voice; u.lang=NAR.voice.lang; } else u.lang='en-GB';
  u.rate=1;
  NAR.u=u; NAR.speaking=true; NAR.until=performance.now()+(text.split(/\s+/).length/2+4)*1000;
  u.onend=u.onerror=()=>{ if(NAR.u===u) NAR.speaking=false; };
  setTimeout(()=>{ if(NAR.u===u) speechSynthesis.speak(u); },80);
}
function stopVoice(){ NAR.speaking=false; NAR.u=null; if('speechSynthesis' in window) speechSynthesis.cancel(); }
function narrating(){ if(!NAR.speaking) return false; if(performance.now()>NAR.until){ NAR.speaking=false; return false; } return true; }
function updateCaption(i,lt){
  const caps=S[i].caps; let ci=0; caps.forEach((c,k)=>{ if(lt>=c[0]) ci=k; });
  const key=i+'-'+ci; if(key!==capKey){ capKey=key; capEl.textContent=caps[ci][1]; speak(caps[ci][1]); }
}
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.globalAlpha=1; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  if(explore){ renderExplore(frameDt); return; }
  const {i,lt}=locate(T), s=S[i], last=i===S.length-1;
  ctx.globalAlpha=Math.min(P(lt,0,.45), last?1:1-P(lt,s.dur-.55,.55));
  s.draw(lt); ctx.globalAlpha=1;
  txt(`${i+1} · ${s.title}`,40,38,{size:15,color:'#555',align:'left',font:MONO});
  updateCaption(i,lt);
  fillEl.style.width=(T/TOTAL*100)+'%'; timeEl.textContent=`${fmt(T)} / ${fmt(TOTAL)}`;
  chapBtns.forEach((b,k)=>b.classList.toggle('active',k===i));
}
function setPlaying(v){
  playing=v; playBtn.textContent=v?'❚❚':'▶';
  if(v){ setExplore(false); bigPlay.style.display='none'; if(T>=TOTAL) seek(0); capKey=null; } else stopVoice();
}
function seek(time){ T=clamp(time,0,TOTAL); capKey=null; stopVoice(); }
function setExplore(v){
  if(explore===v) return; explore=v; exBtn.classList.toggle('on',v); $('explorePanel').classList.toggle('show',v);
  if(v){ if(playing) setPlaying(false); bigPlay.style.display='none';
    capEl.textContent='Failure drill: set the model to slow or down, then change the timeout, retries, pauses and fallback. Can you lose zero tickets and keep the API alive?'; }
  else capKey=null;
}
function frame(ts){
  frameDt=lastTs!=null?(ts-lastTs)/1000:0;
  if(playing){
    let dt=Math.min(frameDt,.1);
    if(voiceOn&&narrating()){ const h=HOLDS.find(x=>x>=T-1e-6); if(h!==undefined&&T+dt>=h) dt=Math.max(0,h-T); }
    T+=dt;
    if(T>=TOTAL){ T=TOTAL; if(!(voiceOn&&narrating())){ setPlaying(false); bigPlay.style.display='block'; bigPlay.textContent='↺'; } }
  }
  lastTs=ts; render(); requestAnimationFrame(frame);
}
cv.addEventListener('pointerdown',()=>{ if(!explore) setPlaying(!playing); });
playBtn.onclick=()=>setPlaying(!playing);
bigPlay.onclick=()=>setPlaying(true);
$('restart').onclick=()=>{ seek(0); setPlaying(true); };
voiceBtn.onclick=()=>{ voiceOn=!voiceOn; voiceBtn.textContent=voiceOn?'🔊 Voice on':'🔈 Voice off'; voiceBtn.classList.toggle('on',voiceOn); if(!voiceOn) stopVoice(); else capKey=null; };
exBtn.onclick=()=>setExplore(!explore);
$('fMode').onchange=e=>D.mode=e.target.value;
$('fTO').onchange=e=>D.to=parseFloat(e.target.value);
$('fRT').oninput=e=>{ D.rt=parseInt(e.target.value); $('fRTV').textContent=D.rt; };
$('fBO').onchange=e=>D.bo=e.target.checked;
$('fFB').onchange=e=>D.fb=e.target.checked;
$('fL').oninput=e=>{ D.lam=parseInt(e.target.value); $('fLV').textContent=D.lam; };
$('fReset').onclick=()=>drill.reset();
$('bar').onclick=e=>{ setExplore(false); const r=$('bar').getBoundingClientRect(); seek((e.clientX-r.left)/r.width*TOTAL); };
document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT'].includes(e.target.tagName)) return;
  if(e.code==='Space'){ e.preventDefault(); setPlaying(!playing); }
  if(e.code==='ArrowRight'){ const {i}=locate(T); if(i<S.length-1) seek(START[i+1]+.001); }
  if(e.code==='ArrowLeft'){ const {i,lt}=locate(T); seek(START[lt<1.5&&i>0?i-1:i]+.001); }
});
requestAnimationFrame(frame);
</script>
</body>
</html>
