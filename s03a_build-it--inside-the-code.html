<script>
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const W=1280, H=720; let dpr=1;
function resize(){ dpr=Math.min(window.devicePixelRatio||1,2); cv.width=W*dpr; cv.height=H*dpr; }
resize(); addEventListener('resize', resize);

const C={white:'#ECECEC',grey:'#7d7d7d',dim:'#444',blue:'#58C4DD',yellow:'#F7D96F',green:'#83C167',red:'#FC6255',teal:'#5CD0B3',purple:'#B189C6',orange:'#FF9A4D'};
const CLASSES=['ESTATES','FINANCE','HR','IT'];
const TEAM={FINANCE:C.yellow, IT:C.blue, ESTATES:C.orange, HR:C.purple};
const SERIF='Georgia, "Times New Roman", serif', MONO='Consolas, "SFMono-Regular", "Liberation Mono", monospace';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const smooth=x=>{x=clamp(x);return x*x*(3-2*x);};
const P=(t,s,d)=>smooth((t-s)/d);
const lerp=(a,b,p)=>a+(b-a)*p;

/* ======================================================================
   A JavaScript copy of the model (TF-IDF + logistic regression),
   trained on the same 40 examples as Guide 1
   ====================================================================== */
const DATA=[
["My expenses have not been reimbursed","FINANCE"],["My overtime payment is missing","FINANCE"],["This invoice is overdue","FINANCE"],
["salary not come this month please check","FINANCE"],["I was paid the wrong amount this month","FINANCE"],["How do I claim travel costs","FINANCE"],
["My payslip shows the wrong tax code","FINANCE"],["The supplier says we did not pay them","FINANCE"],["I need a purchase order for new equipment","FINANCE"],
["My mileage claim was rejected","FINANCE"],["I cannot sign in to my staff account","IT"],["Reset my password please","IT"],["My laptop will not turn on","IT"],
["Email is not working on my phone","IT"],["The printer says it is offline","IT"],["I cannot connect to the wifi","IT"],
["My account is locked after too many attempts","IT"],["The patient record system is very slow","IT"],["I need access to the shared drive","IT"],
["My screen is black and nothing happens","IT"],["How many days of parental leave do I get","HR"],["Annual leave question","HR"],
["I want to change my working hours","HR"],["How do I report sickness absence","HR"],["I want to apply for flexible working","HR"],
["Who do I talk to about a problem with my manager","HR"],["How do I book mandatory training","HR"],["I need a reference letter for a mortgage","HR"],
["How much maternity pay will I get","HR"],["I want to resign what is the notice period","HR"],["The radiator on Ward 4 is leaking","ESTATES"],
["Broken window in clinic 3","ESTATES"],["The lift is out of order","ESTATES"],["The lights in the corridor do not work","ESTATES"],
["The toilet on the second floor is blocked","ESTATES"],["The car park barrier is stuck","ESTATES"],["It is too cold in the waiting room","ESTATES"],
["There is water on the floor near the entrance","ESTATES"],["The door to the store room will not lock","ESTATES"],["A ceiling tile fell down in the office","ESTATES"]];
const tok=s=>(s.toLowerCase().match(/\b\w\w+\b/g)||[]);
const VOC={}; DATA.forEach(([m])=>tok(m).forEach(w=>{ if(!(w in VOC)) VOC[w]=Object.keys(VOC).length; }));
const NV=Object.keys(VOC).length, ND=DATA.length;
const DF=new Array(NV).fill(0); DATA.forEach(([m])=>new Set(tok(m)).forEach(w=>DF[VOC[w]]++));
const IDF=DF.map(d=>Math.log((1+ND)/(1+d))+1);
function vec(s){ const x=new Map(); tok(s).forEach(w=>{ if(w in VOC){ const j=VOC[w]; x.set(j,(x.get(j)||0)+1); } });
  let n=0; x.forEach((c,j)=>{ const v=c*IDF[j]; x.set(j,v); n+=v*v; }); n=Math.sqrt(n)||1; x.forEach((v,j)=>x.set(j,v/n)); return x; }
const WT=CLASSES.map(()=>new Float64Array(NV)), BI=new Float64Array(4);
const scores=x=>CLASSES.map((_,k)=>{ let s=BI[k]; x.forEach((v,j)=>s+=WT[k][j]*v); return s; });
const softmax=s=>{ const m=Math.max(...s), e=s.map(v=>Math.exp(v-m)), z=e.reduce((a,b)=>a+b,0); return e.map(v=>v/z); };
(function train(){ const X=DATA.map(([m])=>vec(m)), Y=DATA.map(([,t])=>CLASSES.indexOf(t)), Creg=10, lr=.04;
  for(let it=0;it<2500;it++){ const gW=CLASSES.map(()=>new Float64Array(NV)), gB=new Float64Array(4);
    X.forEach((x,i)=>{ const p=softmax(scores(x)); for(let k=0;k<4;k++){ const d=p[k]-(Y[i]===k?1:0); gB[k]+=d; x.forEach((v,j)=>gW[k][j]+=d*v); } });
    for(let k=0;k<4;k++){ for(let j=0;j<NV;j++) WT[k][j]-=lr*(gW[k][j]+WT[k][j]/Creg); BI[k]-=lr*gB[k]; } } })();
const proba=s=>softmax(scores(vec(s)));
const argmax=a=>a.indexOf(Math.max(...a));
const pickMsg=(list,test)=>list.find(m=>test(Math.max(...proba(m))))||list[0];
const MSG_SURE=pickMsg(['My expenses have not been reimbursed','My overtime payment is missing','Reset my password please'],c=>c>=.7);
const MSG_UNSURE=pickMsg(['My access card isn’t working','Something is not working near my office','It is not working','card problem'],c=>c<.55);
const PR_SURE=proba(MSG_SURE), PR_UNSURE=proba(MSG_UNSURE);

/* ---------- drawing helpers ---------- */
const fontStr=(size,font,style)=>[style,size+'px',font].filter(Boolean).join(' ');
function txt(s,x,y,o={}){
  const {size=28,color=C.white,align='center',alpha=1,font=SERIF,style='',p=1}=o;
  if(alpha<=0||p<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.font=fontStr(size,font,style); ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='middle';
  if(p<1){ const w=ctx.measureText(s).width, x0=align==='center'?x-w/2:align==='right'?x-w:x; ctx.beginPath(); ctx.rect(x0-4,y-size,(w+8)*p,size*2); ctx.clip(); }
  ctx.fillText(s,x,y); ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function box(x,y,w,h,o={}){
  const {stroke=C.white,fill=null,alpha=1,lw=2,r=10,p=1,dash=null}=o; if(alpha<=0||p<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; rr(x,y,w,h,r); if(fill){ctx.fillStyle=fill;ctx.fill();}
  const L=2*(w+h); if(p<1) ctx.setLineDash([L*p,L]); else if(dash) ctx.setLineDash(dash);
  ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.stroke(); ctx.restore();
}
function rect(x,y,w,h,color,alpha=1){ if(alpha<=0||w<=0) return; ctx.save(); ctx.globalAlpha*=alpha; ctx.fillStyle=color; ctx.fillRect(x,y,w,h); ctx.restore(); }
function seg(x1,y1,x2,y2,o={}){
  const {color=C.white,lw=2,alpha=1,p=1,dash=null}=o; if(p<=0||alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineCap='round'; if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(lerp(x1,x2,p),lerp(y1,y2,p)); ctx.stroke(); ctx.restore();
}
function arrow(x1,y1,x2,y2,o={}){
  const {color=C.white,p=1,alpha=1,lw=2.2,head=10}=o; if(p<=0||alpha<=0) return;
  seg(x1,y1,x2,y2,{color,lw,alpha,p});
  const x=lerp(x1,x2,p), y=lerp(y1,y2,p), a=Math.atan2(y2-y1,x2-x1);
  ctx.save(); ctx.globalAlpha*=alpha; ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(x,y);
  ctx.lineTo(x-head*Math.cos(a-.4),y-head*Math.sin(a-.4)); ctx.lineTo(x-head*Math.cos(a+.4),y-head*Math.sin(a+.4)); ctx.closePath(); ctx.fill(); ctx.restore();
}
function dot(x,y,r,color,alpha=1){ if(alpha<=0) return; ctx.save(); ctx.globalAlpha*=alpha; ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.restore(); }
function tag(x,y,s,col,a,size=14){ if(a<=0) return; ctx.save(); ctx.font=fontStr(size,MONO,''); const w=ctx.measureText(s).width+20; ctx.restore();
  box(x-w/2,y-size,w,size*2,{stroke:col,fill:'rgba(0,0,0,.92)',alpha:a,r:6}); txt(s,x,y,{size,font:MONO,color:col,alpha:a}); }
function fileIcon(x,y,w,h,label,sub,col,a){ if(a<=0) return;
  ctx.save(); ctx.globalAlpha*=a; ctx.strokeStyle=col; ctx.lineWidth=2; ctx.fillStyle='rgba(0,0,0,.92)';
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+w-18,y); ctx.lineTo(x+w,y+18); ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+w-18,y); ctx.lineTo(x+w-18,y+18); ctx.lineTo(x+w,y+18); ctx.stroke(); ctx.restore();
  txt(label,x+w/2,y+h/2-(sub?9:0),{size:15,font:MONO,color:col,alpha:a}); if(sub) txt(sub,x+w/2,y+h/2+14,{size:12,style:'italic',color:C.grey,alpha:a}); }
const wrapMono=(s,n)=>{ const out=[]; let cur=''; s.split(' ').forEach(w=>{ if((cur+' '+w).trim().length>n){ out.push(cur); cur=w; } else cur=(cur+' '+w).trim(); }); if(cur) out.push(cur); return out; };

/* ---------- code panel ---------- */
const TRAIN_CODE=['import joblib','from sklearn.pipeline import make_pipeline','from sklearn.feature_extraction.text import TfidfVectorizer',
 'from sklearn.linear_model import LogisticRegression','','texts, teams = read_tickets("data/staff_tickets.csv")','',
 'pipeline = make_pipeline(','    TfidfVectorizer(),','    LogisticRegression(max_iter=1000),',')',
 'pipeline.fit(texts, teams)        # learn from examples','joblib.dump(pipeline, "model/router.joblib")'];
const APP_CODE=['import joblib','from fastapi import FastAPI','from pydantic import BaseModel','',
 'THRESHOLD = 0.60','model = joblib.load("model/router.joblib")','app = FastAPI()','',
 '@app.get("/")','def root():','    return {"status": "Harbourside router running"}','',
 'class Ticket(BaseModel):','    message: str','',
 '@app.post("/predictions")','def predict(ticket: Ticket):','    probs = model.predict_proba([ticket.message])[0]','    best = probs.argmax()',
 '    team = model.classes_[best]','    confidence = float(probs[best])','    if confidence < THRESHOLD:','        team = "HUMAN_REVIEW"',
 '    return {"team": team,','            "confidence": round(confidence, 2),','            "human_review": team == "HUMAN_REVIEW"}'];
const TOKRE=/(#.*$)|("[^"]*")|(@[\w.]+)|(\b(?:import|from|def|class|return|if)\b)|(\b\d+(?:\.\d+)?\b)/g;
let CW=0;
function codeLine(s,x,y,a){
  if(!CW){ ctx.save(); ctx.font=fontStr(16,MONO,''); CW=ctx.measureText('M').width; ctx.restore(); }
  const segs=[]; let last=0, m; TOKRE.lastIndex=0;
  while((m=TOKRE.exec(s))){ if(m.index>last) segs.push([s.slice(last,m.index),C.white]);
    segs.push([m[0],m[1]?C.grey:m[2]?C.green:m[3]?C.yellow:m[4]?C.purple:C.orange]); last=m.index+m[0].length; if(m[0]==='') TOKRE.lastIndex++; }
  if(last<s.length) segs.push([s.slice(last),C.white]);
  let col=0; segs.forEach(([t,c])=>{ txt(t,x+col*CW,y,{size:16,font:MONO,color:c,align:'left',alpha:a}); col+=t.length; });
}
function drawCode(code,name,o={}){
  const {a=1,hl=[],marks={},focus=false}=o; if(a<=0) return;
  box(30,80,740,600,{stroke:'#2a2a32',fill:'rgba(14,14,18,.96)',alpha:a});
  box(30,48,150,36,{stroke:'#2a2a32',fill:'rgba(14,14,18,.96)',alpha:a,r:6});
  txt(name,105,66,{size:15,font:MONO,color:C.blue,alpha:a});
  code.forEach((s,i)=>{ const y=112+i*21.5, on=hl.includes(i), mk=marks[i];
    if(on||mk){ rect(32,y-10.5,736,21,mk||C.yellow,a*.15); rect(32,y-10.5,4,21,mk||C.yellow,a); }
    txt(String(i+1),62,y,{size:12,font:MONO,color:'#4a4a4a',align:'right',alpha:a});
    codeLine(s,76,y,a*(focus&&!on&&!mk?.32:1)); });
}
const hlAt=(t,ws)=>{ let r=[]; ws.forEach(([s,l])=>{ if(t>=s) r=l; }); return r; };

/* ---------- variables panel for predict() ---------- */
function traceVars(msg,pr,upto,y0,thr,a=1){
  if(a<=0) return;
  const best=argmax(pr), conf=pr[best], low=conf<thr, team=low?'HUMAN_REVIEW':CLASSES[best];
  const lines=wrapMono(`message = "${msg}"`,46);
  lines.slice(0,2).forEach((l,i)=>txt(l,800,y0+i*20,{size:14,font:MONO,color:C.green,align:'left',alpha:a}));
  if(upto>=0){ txt('probs =',800,y0+50,{size:14,font:MONO,align:'left',alpha:a});
    CLASSES.forEach((k,i)=>{ const y=y0+76+i*26, on=upto>=1&&i===best;
      txt(`[${i}] ${k}`,812,y,{size:13,font:MONO,color:TEAM[k],align:'left',alpha:a});
      rect(930,y-8,220*pr[i],16,TEAM[k],a*.85); txt(pr[i].toFixed(2),930+220*pr[i]+8,y,{size:13,font:MONO,align:'left',alpha:a,color:on?C.white:C.grey});
      if(on) box(805,y-12,430,24,{stroke:C.yellow,alpha:a,r:5}); }); }
  const row=(k,s,col,yy)=>{ if(upto>=k) txt(s,800,y0+yy,{size:15,font:MONO,color:col,align:'left',alpha:a}); };
  row(1,`best = ${best}`,C.white,192);
  row(2,`team = "${CLASSES[best]}"`,TEAM[CLASSES[best]],220);
  row(3,`confidence = ${conf.toFixed(2)}`,C.white,248);
  row(4,`${conf.toFixed(2)} < ${thr.toFixed(2)} ?  →  ${low?'True':'False'}`,low?C.yellow:C.green,276);
  if(upto>=5) txt(low?'team = "HUMAN_REVIEW"':'(line skipped)',800,y0+304,{size:15,font:MONO,color:low?C.yellow:C.grey,align:'left',alpha:a,style:low?'':'italic'});
  if(upto>=6){ box(795,y0+326,445,92,{stroke:C.green,fill:'rgba(0,0,0,.9)',alpha:a});
    txt(`{"team": "${team}",`,812,y0+348,{size:14,font:MONO,color:C.green,align:'left',alpha:a});
    txt(` "confidence": ${conf.toFixed(2)},`,812,y0+371,{size:14,font:MONO,color:C.green,align:'left',alpha:a});
    txt(` "human_review": ${low?'true':'false'}}`,812,y0+394,{size:14,font:MONO,color:C.green,align:'left',alpha:a}); }
}
const TRACE_LINES=[[17],[18],[19],[20],[21],[22],[23,24,25]];

/* ======================================================================
   SCENES
   ====================================================================== */
const S=[
/* 1 ─ Two files, two moments */
{title:'Two files, two moments',dur:22,
 caps:[[0,"Our routing service is built from two small files. Each one runs at a different moment."],
       [5.5,"train.py runs once, or whenever we retrain. It learns from examples and saves a model file."],
       [12,"app.py runs all the time. It loads that file, then answers every request that arrives."],
       [18,"Let's read both, line by line."]],
 draw(t){
   txt('SECTION · BUILD IT',640,110,{size:15,font:MONO,color:C.yellow,alpha:P(t,.2,.8)*(1-P(t,5,.6))});
   const a1=P(t,5.6,.7), a2=P(t,12.1,.7);
   box(120,150,330,200,{stroke:C.teal,lw:2.5,alpha:a1,p:a1}); txt('train.py',285,200,{size:30,font:MONO,color:C.teal,alpha:a1});
   txt('runs once · learns · saves',285,250,{size:18,style:'italic',alpha:a1}); txt('fit()',285,300,{size:20,font:MONO,color:C.grey,alpha:a1});
   fileIcon(560,205,160,90,'router.joblib','the model',C.white,P(t,8.5,.6));
   arrow(452,250,556,250,{p:P(t,8,.6)}); arrow(724,250,826,250,{p:P(t,12.6,.6)});
   box(830,150,330,200,{stroke:C.blue,lw:2.5,alpha:a2,p:a2}); txt('app.py',995,200,{size:30,font:MONO,color:C.blue,alpha:a2});

let EX=null;
function buildTrace(){
  const msg=$('exMsg').value.trim(), kase=$('exCase').value, thr=parseFloat($('exThr').value);
  const text=kase==='empty'?'':(msg||'My laptop will not turn on');
  const steps=[];
  if(kase==='wrong'){ steps.push({lines:[8,15],marks:{8:C.orange,15:C.orange},say:'POST /predict matches no decorator.',col:C.orange,end:'404'}); }
  else {
    steps.push({lines:[15,16],say:'POST /predictions matches @app.post → predict()',col:C.green});
    if(kase==='missing') steps.push({lines:[12,13],marks:{12:C.orange,13:C.orange},say:'No "message" field → FastAPI replies 422. predict() never runs.',col:C.orange,end:'422'});
    else {
      steps.push({lines:[12,13],say:kase==='empty'?'Ticket check: "" is still text ✓ (valid, but empty)':'Ticket check: message is text ✓',col:kase==='empty'?C.yellow:C.green});
      const pr=proba(text), low=Math.max(...pr)<thr;
      for(let u=0;u<=6;u++){ if(u===5&&!low){ steps.push({lines:[],marks:{22:'#555'},upto:5,say:'Condition is False: line 23 is skipped',col:C.grey}); continue; }
        steps.push({lines:TRACE_LINES[u],upto:u,say:['predict_proba → one probability per team','argmax → position of the biggest','classes_[best] → team name','float(...) → confidence','compare with THRESHOLD','team becomes HUMAN_REVIEW','return → JSON reply'][u],col:C.white}); }
      steps.push({lines:[23,24,25],upto:6,say:kase==='empty'?'200 (!): the shape was valid, the answer is useless':'200 OK',col:kase==='empty'?C.yellow:C.green,end:kase==='empty'?'200 (!)':'200'});
      EX={steps,t0:performance.now()/1000,text,thr,pr,kase}; return;
    }
  }
  EX={steps,t0:performance.now()/1000,text,thr,pr:null,kase};
}

const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

/* ---------- NARRATOR: every word is spoken before the video moves on ---------- */
const SAY=[[/“|”|"/g,''],[/TF-IDF/g,'T F I D F'],[/\b2xx\b/g,'two hundreds'],[/\b4xx\b/g,'four hundreds'],[/\b5xx\b/g,'five hundreds'],
  [/HUMAN_REVIEW/g,'human review'],[/\bFINANCE\b/g,'Finance'],[/\bESTATES\b/g,'Estates'],[/\bIT\b/g,'I T'],[/\bHR\b/g,'H R'],
  [/\bCCIO\b/g,'C C I O'],[/(\d{2}):(\d{2})/g,(m,h,mi)=>`${+h} ${mi==='00'?"o'clock":mi}`],[/7f3a/g,'7 F 3 A'],
  [/train\.py/g,'train dot pie'],[/app\.py/g,'app dot pie'],[/predict_proba/g,'predict proba'],[/classes_/g,'classes'],[/argmax/g,'arg max'],[/\//g,' slash ']];
const NAR={u:null,speaking:false,until:0,voice:null,list:[]};
const HOLDS=[]; S.forEach((s,i)=>{ s.caps.forEach((c,k)=>{ if(k>0) HOLDS.push(START[i]+c[0]-.02); }); HOLDS.push(START[i]+s.dur-.6); }); HOLDS.sort((a,b)=>a-b);
const vSel=document.createElement('select'); vSel.title='Narrator voice';
vSel.style.cssText='background:#16161a;border:1px solid #2a2a30;color:#ddd;border-radius:8px;height:38px;padding:0 8px;font-family:inherit;font-size:13px;max-width:200px';
voiceBtn.after(vSel);
const vNorm=l=>(l||'').replace('_','-');
const vRank=v=>{ const l=vNorm(v.lang); return /^en-GB/i.test(l)?0:/^en-US/i.test(l)?1:/^en/i.test(l)?2:9; };
const vGood=v=>/natural|online|google|neural|premium|enhanced/i.test(v.name)?1:0;
const vName=v=>v.name.replace(/^(Microsoft|Google|Apple) /,'').replace(/\s*-\s*English.*$/,'').slice(0,34);
function pickVoices(){
  if(!('speechSynthesis' in window)) return;
  const vs=speechSynthesis.getVoices().filter(v=>vRank(v)<9).sort((a,b)=>vRank(a)-vRank(b)||vGood(b)-vGood(a));
  if(!vs.length) return;
  NAR.list=vs; vSel.innerHTML='';
  const label={0:'🇬🇧 UK English',1:'🇺🇸 US English',2:'Other English'}; let g=null, og=null;
  vs.forEach((v,i)=>{
    const r=vRank(v);
    if(r!==g){ g=r; og=document.createElement('optgroup'); og.label=label[r]; vSel.appendChild(og); }
    const o=document.createElement('option'); o.value=i; o.textContent=vName(v)+' · '+vNorm(v.lang); og.appendChild(o);
  });
  if(!vs.some(v=>vRank(v)===0)){
    const og2=document.createElement('optgroup'); og2.label='No UK voice on this device';
    const o=document.createElement('option'); o.value='help'; o.textContent='➕ How to add a UK English voice'; og2.appendChild(o); vSel.appendChild(og2);
  }
  const cur=NAR.voice?vs.findIndex(v=>v.name===NAR.voice.name):-1, i=cur>=0?cur:0;
  vSel.value=String(i); NAR.voice=vs[i];
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=pickVoices; pickVoices(); [300,1200,3500].forEach(ms=>setTimeout(pickVoices,ms)); }
else vSel.style.display='none';
vSel.onchange=()=>{
  if(vSel.value==='help'){
    capEl.textContent='To add a UK voice — Windows: Settings → Time & language → Speech → Add voices → English (United Kingdom). Mac: System Settings → Accessibility → Spoken Content → System voice → Manage Voices → English (UK). Or open this page in Microsoft Edge or Google Chrome, which include free UK voices. Then reload the page.';
    vSel.value=String(Math.max(0,NAR.list.indexOf(NAR.voice))); return;
  }
  NAR.voice=NAR.list[+vSel.value]; stopVoice(); capKey=null;
};
function speak(s){
  if(!voiceOn||!playing||!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const text=SAY.reduce((a,[r,v])=>a.replace(r,v),s);
  const u=new SpeechSynthesisUtterance(text);
  if(NAR.voice){ u.voice=NAR.voice; u.lang=NAR.voice.lang; } else u.lang='en-GB';
  u.rate=1;
  NAR.u=u; NAR.speaking=true; NAR.until=performance.now()+(text.split(/\s+/).length/2+4)*1000;
  u.onend=u.onerror=()=>{ if(NAR.u===u) NAR.speaking=false; };
  setTimeout(()=>{ if(NAR.u===u) speechSynthesis.speak(u); },80);
}
function stopVoice(){ NAR.speaking=false; NAR.u=null; if('speechSynthesis' in window) speechSynthesis.cancel(); }
function narrating(){ if(!NAR.speaking) return false; if(performance.now()>NAR.until){ NAR.speaking=false; return false; } return true; }

function updateCaption(i,lt){
  const caps=S[i].caps; let ci=0; caps.forEach((c,k)=>{ if(lt>=c[0]) ci=k; });
  const key=i+'-'+ci; if(key!==capKey){ capKey=key; capEl.textContent=caps[ci][1]; speak(caps[ci][1]); }
}
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.globalAlpha=1; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  if(explore){ renderExplore(); return; }
  const {i,lt}=locate(T), s=S[i], last=i===S.length-1;
  ctx.globalAlpha=Math.min(P(lt,0,.45), last?1:1-P(lt,s.dur-.55,.55));
  s.draw(lt); ctx.globalAlpha=1;
  txt(`${i+1} · ${s.title}`,1240,30,{size:14,color:'#555',align:'right',font:MONO});
  updateCaption(i,lt);
  fillEl.style.width=(T/TOTAL*100)+'%'; timeEl.textContent=`${fmt(T)} / ${fmt(TOTAL)}`;
  chapBtns.forEach((b,k)=>b.classList.toggle('active',k===i));
}
function setPlaying(v){
  playing=v; playBtn.textContent=v?'❚❚':'▶';
  if(v){ setExplore(false); bigPlay.style.display='none'; if(T>=TOTAL) seek(0); capKey=null; } else stopVoice();
}
function seek(time){ T=clamp(time,0,TOTAL); capKey=null; stopVoice(); }
function setExplore(v){
  if(explore===v) return; explore=v; exBtn.classList.toggle('on',v); $('explorePanel').classList.toggle('show',v);
  if(v){ if(playing) setPlaying(false); bigPlay.style.display='none';
    capEl.textContent='Type any staff message, choose a test, and press Run. The highlighted line is the one running now; the values appear on the right.'; }
  else capKey=null;
}
function frame(ts){
  frameDt=lastTs!=null?(ts-lastTs)/1000:0;
  if(playing){
    let dt=Math.min(frameDt,.1);
    if(voiceOn&&narrating()){ const h=HOLDS.find(x=>x>=T-1e-6); if(h!==undefined&&T+dt>=h) dt=Math.max(0,h-T); }
    T+=dt;
    if(T>=TOTAL){ T=TOTAL; if(!(voiceOn&&narrating())){ setPlaying(false); bigPlay.style.display='block'; bigPlay.textContent='↺'; } }
  }
  lastTs=ts; render(); requestAnimationFrame(frame);
}
cv.addEventListener('pointerdown',()=>{ if(!explore) setPlaying(!playing); });
playBtn.onclick=()=>setPlaying(!playing);
bigPlay.onclick=()=>setPlaying(true);
$('restart').onclick=()=>{ seek(0); setPlaying(true); };
voiceBtn.onclick=()=>{ voiceOn=!voiceOn; voiceBtn.textContent=voiceOn?'🔊 Voice on':'🔈 Voice off'; voiceBtn.classList.toggle('on',voiceOn); if(!voiceOn) stopVoice(); else capKey=null; };
exBtn.onclick=()=>setExplore(!explore);
$('exThr').oninput=e=>{ $('exThrV').textContent=parseFloat(e.target.value).toFixed(2); };
$('exRun').onclick=()=>{ buildTrace(); capEl.textContent='Watch the highlighted line move. Try a vague message, a message with spelling mistakes, or a different THRESHOLD.'; };
$('exMsg').addEventListener('keydown',e=>{ if(e.key==='Enter') $('exRun').click(); });
$('bar').onclick=e=>{ setExplore(false); const r=$('bar').getBoundingClientRect(); seek((e.clientX-r.left)/r.width*TOTAL); };
document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT'].includes(e.target.tagName)) return;
  if(e.code==='Space'){ e.preventDefault(); setPlaying(!playing); }
  if(e.code==='ArrowRight'){ const {i}=locate(T); if(i<S.length-1) seek(START[i+1]+.001); }
  if(e.code==='ArrowLeft'){ const {i,lt}=locate(T); seek(START[lt<1.5&&i>0?i-1:i]+.001); }
});
requestAnimationFrame(frame);
</script>
</body>
</html>
