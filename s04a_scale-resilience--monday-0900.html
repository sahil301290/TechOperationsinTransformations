<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=1280, H=720; let dpr=1;
function resize(){ dpr=Math.min(window.devicePixelRatio||1,2); cv.width=W*dpr; cv.height=H*dpr; }
resize(); addEventListener('resize', resize);

const C={white:'#ECECEC',grey:'#7d7d7d',dim:'#444',blue:'#58C4DD',yellow:'#F7D96F',green:'#83C167',red:'#FC6255',teal:'#5CD0B3',purple:'#B189C6',orange:'#FF9A4D'};
const SERIF='Georgia, "Times New Roman", serif', MONO='Consolas, "SFMono-Regular", "Liberation Mono", monospace';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const smooth=x=>{x=clamp(x);return x*x*(3-2*x);};
const P=(t,s,d)=>smooth((t-s)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ---------- drawing helpers ---------- */
const fontStr=(size,font,style)=>[style,size+'px',font].filter(Boolean).join(' ');
function txt(s,x,y,o={}){
  const {size=28,color=C.white,align='center',alpha=1,font=SERIF,style='',p=1}=o;
  if(alpha<=0||p<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.font=fontStr(size,font,style); ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='middle';
  if(p<1){ const w=ctx.measureText(s).width, x0=align==='center'?x-w/2:align==='right'?x-w:x; ctx.beginPath(); ctx.rect(x0-4,y-size,(w+8)*p,size*2); ctx.clip(); }
  ctx.fillText(s,x,y); ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function box(x,y,w,h,o={}){
  const {stroke=C.white,fill=null,alpha=1,lw=2,r=10,p=1,dash=null}=o; if(alpha<=0||p<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; rr(x,y,w,h,r); if(fill){ctx.fillStyle=fill;ctx.fill();}
  const L=2*(w+h); if(p<1) ctx.setLineDash([L*p,L]); else if(dash) ctx.setLineDash(dash);
  ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.stroke(); ctx.restore();
}
function seg(x1,y1,x2,y2,o={}){
  const {color=C.white,lw=2,alpha=1,p=1,dash=null}=o; if(p<=0||alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineCap='round'; if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(lerp(x1,x2,p),lerp(y1,y2,p)); ctx.stroke(); ctx.restore();
}
function arrow(x1,y1,x2,y2,o={}){
  const {color=C.white,p=1,alpha=1,lw=2.5,head=12}=o; if(p<=0||alpha<=0) return;
  seg(x1,y1,x2,y2,{color,lw,alpha,p});
  const x=lerp(x1,x2,p), y=lerp(y1,y2,p), a=Math.atan2(y2-y1,x2-x1);
  ctx.save(); ctx.globalAlpha*=alpha; ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(x,y);
  ctx.lineTo(x-head*Math.cos(a-.4),y-head*Math.sin(a-.4)); ctx.lineTo(x-head*Math.cos(a+.4),y-head*Math.sin(a+.4)); ctx.closePath(); ctx.fill(); ctx.restore();
}
function dot(x,y,r,color,alpha=1){ if(alpha<=0) return; ctx.save(); ctx.globalAlpha*=alpha; ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.restore(); }
function ring(x,y,r,color,alpha=1,lw=2){ if(alpha<=0) return; ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke(); ctx.restore(); }
function arc(x,y,r,f,color,alpha=1,lw=2.5){ if(alpha<=0) return; ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.beginPath(); ctx.arc(x,y,r,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(f)); ctx.stroke(); ctx.restore(); }
function poly(pts,o={}){
  const {color=C.white,lw=2.5,alpha=1}=o; if(alpha<=0||pts.length<2) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineJoin='round'; ctx.beginPath();
  pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.stroke(); ctx.restore();
}
function cylinder(cx,cy,w,h,color,a){
  if(a<=0) return; ctx.save(); ctx.globalAlpha*=a; ctx.strokeStyle=color; ctx.lineWidth=2; ctx.fillStyle='rgba(0,0,0,.9)';
  ctx.beginPath(); ctx.ellipse(cx,cy+h/2,w/2,12,0,0,Math.PI); ctx.lineTo(cx-w/2,cy-h/2); ctx.ellipse(cx,cy-h/2,w/2,12,0,Math.PI,0,true); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx,cy-h/2,w/2,12,0,0,Math.PI*2); ctx.stroke(); ctx.restore();
}

/* ======================================================================
   QUEUE SIMULATOR (deterministic, seekable)
   ====================================================================== */
const DT=.02;
class Sim{
  constructor(cfg){ this.cfg=cfg; this.reset(); }
  reset(){
    const c=this.cfg; this.t=0; this.rng=mulberry32(c.seed||3); this.reqs=[]; this.id=0; this.rr=0;
    this.srv=[]; for(let k=0;k<c.max;k++) this.srv.push({q:[],cur:null,healthy:true,inbound:0});
    this.nextArr=this.gap(0); this.hist=[]; this.histT=0; this.nextCheck=0; this.pings=[]; this.waits=[]; this.served=0;
  }
  gap(t){ const l=this.cfg.lambda(t); return l<=.01 ? t+.5 : t-Math.log(1-this.rng())/l; }
  up(t,k){ return this.cfg.up ? this.cfg.up(t,k) : true; }
  choose(t,ex=-1){
    const n=this.cfg.copies(t); let best=-1, bl=1e9;
    for(let i=0;i<n;i++){ const k=(this.rr+i)%n, s=this.srv[k]; if(!s.healthy||k===ex) continue;
      const l=s.q.length+(s.cur?1:0)+s.inbound; if(l<bl){bl=l;best=k;} }
    this.rr=(this.rr+1)%Math.max(1,n); return best;
  }
  reroute(r,fromK,t){
    const nk=this.choose(t,fromK); r.fromK=fromK;
    if(nk<0){ r.ph='toLB'; r.t0=t-this.cfg.tLB; r.k=-1; return; }
    r.ph='re'; r.t0=t; r.k=nk; this.srv[nk].inbound++;
  }
  step(dt){
    const c=this.cfg, t=this.t+dt, n=c.copies(t);
    while(this.nextArr<=t){ this.reqs.push({id:this.id++,ph:'toLB',t0:this.nextArr,k:-1,fromK:-1}); this.nextArr=this.gap(this.nextArr); }
    if(t>=this.nextCheck){
      if(c.hcOn && c.hcOn()){
        const res=[];
        for(let k=0;k<n;k++){ const ok=this.up(t,k), s=this.srv[k]; res.push(ok);
          if(!ok&&s.healthy){ s.healthy=false; const moved=s.cur?[s.cur,...s.q]:[...s.q]; s.cur=null; s.q=[]; moved.forEach(r=>this.reroute(r,k,t)); }
          else if(ok&&!s.healthy) s.healthy=true; }
        this.pings.push({t,res}); if(this.pings.length>4) this.pings.shift();
      } else this.srv.forEach(s=>s.healthy=true);
      this.nextCheck+=c.hcInt||2;
    }
    for(const r of this.reqs){
      if(r.ph==='toLB'){ if(t-r.t0>=c.tLB){ const k=this.choose(t); if(k>=0){ r.ph='toSrv'; r.t0=t; r.k=k; r.fromK=-1; this.srv[k].inbound++; } } }
      else if(r.ph==='toSrv'||r.ph==='re'){ if(t-r.t0>=c.tSrv){ const s=this.srv[r.k]; s.inbound--;
          if(r.k>=n){ this.reroute(r,r.k,t); continue; }
          r.ph='queue'; if(r.q0==null) r.q0=t; s.q.push(r); } }
      else if(r.ph==='out'){ if(t-r.t0>=.6) r.ph='done'; }
    }
    this.srv.forEach((s,k)=>{ if(!this.up(t,k)) return;
      if(s.cur&&t>=s.cur.end){ const r=s.cur; r.ph='out'; r.t0=t; s.cur=null; this.waits.push([t,r.start-r.q0]); this.served++; }
      if(!s.cur&&s.q.length){ const r=s.q.shift(); r.ph='serve'; r.start=t; r.end=t+(1/c.mu)*(.7+.6*this.rng()); s.cur=r; } });
    this.reqs=this.reqs.filter(r=>r.ph!=='done');
    this.t=t;
    if(t>=this.histT){ this.hist.push([t,this.waitingCount()]); this.histT+=.25; if(this.hist.length>500) this.hist.shift(); }
    if(this.waits.length>600) this.waits.splice(0,150);
  }
  waitingCount(){ return this.srv.reduce((a,s)=>a+s.q.length,0)+this.reqs.filter(r=>r.ph==='toLB'&&this.t-r.t0>=this.cfg.tLB).length; }
  advanceTo(T){ while(this.t+DT<=T+1e-9) this.step(DT); }
}
function syncSim(sim,t){ if(t<sim.t-1e-6) sim.reset(); sim.advanceTo(t); }
const waitCol=w=>w<2?C.blue:w<5?C.orange:C.red;
const slotPos=(L,k,i)=>[L.sx-L.bw/2-16-i*13, L.ys[k]];
const slotsFor=L=>Math.max(3,Math.floor((L.sx-L.bw/2-16-(L.lb?L.lb[0]+80:L.src[0]+70))/13));

function drawSim(sim,L,a=1){
  const t=sim.t, c=sim.cfg, n=c.copies(t), slots=slotsFor(L);
  for(let i=0;i<5;i++) ring(L.src[0],L.src[1]-60+i*30,9,C.blue,a);
  txt('Staff',L.src[0],L.src[1]+96,{size:18,style:'italic',color:C.grey,alpha:a});
  if(L.lb){ box(L.lb[0]-60,L.lb[1]-38,120,76,{stroke:C.yellow,alpha:a}); txt('Load',L.lb[0],L.lb[1]-12,{size:17,alpha:a}); txt('balancer',L.lb[0],L.lb[1]+12,{size:17,alpha:a}); }
  L.ys.forEach((y,k)=>{
    const sa=a*(L.alpha?L.alpha(k):(k<n?1:0)); if(sa<=0) return;
    const s=sim.srv[k], up=sim.up(t,k);
    if(L.lb) seg(L.lb[0]+60,L.lb[1],L.sx-L.bw/2,y,{color:'#24242c',lw:1.5,alpha:sa});
    box(L.sx-L.bw/2,y-L.bh/2,L.bw,L.bh,{stroke:(!up||!s.healthy)?C.red:C.teal,alpha:sa*(s.healthy?1:.65),dash:s.healthy?null:[6,5]});
    txt(L.single?'API':`API copy ${k+1}`,L.sx+12,y-(L.bh>56?11:8),{size:L.bh>56?16:14,alpha:sa});
    const st=!up?'crashed':!s.healthy?'out of rotation':s.cur?'serving':'idle';
    txt(st,L.sx+12,y+(L.bh>56?13:10),{size:12,style:'italic',color:!up?C.red:C.grey,alpha:sa});
    const q=s.q;
    for(let i=0;i<Math.min(q.length,slots);i++){
      const [x,yy]=slotPos(L,k,i);
      if(i===slots-1&&q.length>slots){ txt('+'+(q.length-slots+1),x-4,yy,{size:14,font:MONO,color:C.red,alpha:sa,align:'right'}); break; }
      dot(x,yy,5,waitCol(t-q[i].q0),sa);
    }
    if(s.cur){ const cx=L.sx-L.bw/2+22; dot(cx,y,5,C.white,sa); arc(cx,y,11,(t-s.cur.start)/(s.cur.end-s.cur.start),C.yellow,sa,2); }
  });
  let stuck=0;
  sim.reqs.forEach(r=>{
    let pos=null, col=C.blue, al=a;
    if(r.ph==='toLB'){
      const u=clamp((t-r.t0)/c.tLB), sy=L.src[1]+((r.id*37)%5-2)*30;
      const dest=L.lb?L.lb:slotPos(L,0,sim.srv[0].q.length);
      pos=[lerp(L.src[0]+12,dest[0],smooth(u)),lerp(sy,dest[1],smooth(u))];
      if(u>=1&&L.lb){ pos=[L.lb[0]-45+(stuck%10)*10,L.lb[1]+52+Math.floor(stuck/10)*10]; col=C.red; stuck++; }
    } else if(r.ph==='toSrv'||r.ph==='re'){
      const u=clamp((t-r.t0)/Math.max(c.tSrv,.001));
      const fromVis=r.ph==='re'&&r.fromK>=0&&r.fromK<L.ys.length&&(L.alpha?L.alpha(r.fromK)>0:r.fromK<n);
      const from=fromVis?[L.sx-L.bw/2,L.ys[r.fromK]]:(L.lb||L.src);
      const to=slotPos(L,r.k,sim.srv[r.k].q.length);
      pos=[lerp(from[0],to[0],smooth(u)),lerp(from[1],to[1],smooth(u))]; if(r.ph==='re') col=C.orange;
    } else if(r.ph==='out'){ const u=clamp((t-r.t0)/.6); pos=[lerp(L.sx+L.bw/2,L.exitX,u),L.ys[r.k]]; col=C.green; al=a*(1-u); }
    if(pos) dot(pos[0],pos[1],5,col,al);
  });
  if(L.lb) sim.pings.forEach(p=>{
    const u=(t-p.t)/.9; if(u<0||u>1.4) return;
    p.res.forEach((ok,k)=>{
      if(k>=L.ys.length) return;
      const A=[L.lb[0]+60,L.lb[1]], B=[L.sx-L.bw/2,L.ys[k]];
      if(u<.5){ const v=u/.5; dot(lerp(A[0],B[0],v),lerp(A[1],B[1],v),3.5,C.white,a*.9); }
      else if(u<1&&ok){ const v=(u-.5)/.5; dot(lerp(B[0],A[0],v),lerp(B[1],A[1],v),3.5,C.green,a*.9); }
      if(u>=.5) txt(ok?'200':'✗ no answer',B[0]+L.bw+28,B[1]-L.bh/2+8,{size:13,font:MONO,color:ok?C.green:C.red,align:'left',alpha:a*(1-clamp((u-1)/.4))});
    });
  });
}
function graph(sim,x,y,w,h,t0,t1,maxY,a,title){
  if(a<=0) return;
  box(x,y,w,h,{stroke:'#2c2c33',fill:'rgba(8,8,11,.9)',alpha:a});
  txt(title,x+14,y+18,{size:14,font:MONO,color:C.grey,align:'left',alpha:a});
  txt(String(maxY),x+w-10,y+40,{size:12,font:MONO,color:'#555',align:'right',alpha:a});
  const gx=v=>lerp(x+14,x+w-14,(v-t0)/(t1-t0)), gy=v=>lerp(y+h-12,y+40,clamp(v/maxY));
  const pts=sim.hist.filter(([tt])=>tt>=t0&&tt<=t1).map(([tt,v])=>[gx(tt),gy(v)]);
  seg(x+14,y+h-12,x+w-14,y+h-12,{color:'#333',lw:1,alpha:a});
  poly(pts,{color:C.yellow,lw:2.5,alpha:a});
}

/* ---------- layouts ---------- */
const L1={src:[90,330],lb:null,sx:840,ys:[330],bw:150,bh:90,exitX:1210,single:true};
const L3={src:[80,340],lb:[440,340],sx:1000,ys:[180,340,500],bw:150,bh:80,exitX:1230};
function layoutFor(n){ const sp=Math.min(150,440/n), ys=[]; for(let k=0;k<n;k++) ys.push(360+(k-(n-1)/2)*sp);
  return {src:[80,360],lb:[420,360],sx:1000,ys,bw:150,bh:Math.min(80,sp-16),exitX:1230}; }

/* ======================================================================
   SCENES
   ====================================================================== */
const hx1=h=>lerp(150,1130,(h-7)/5), vy1=v=>lerp(520,150,v/300);
const normalDay=h=>8+40*Math.exp(-((h-10)**2)/(2*1.6**2));
const mondayDay=h=>normalDay(h)+235*smooth((h-8.92)/.16)*Math.exp(-Math.max(0,h-9.25)/.65);
const curvePts=(fn,h0,h1,X,Y)=>{ const p=[]; for(let i=0;i<=240;i++){ const h=lerp(h0,h1,i/240); p.push([X(h),Y(fn(h))]); } return p; };

const hx7=h=>lerp(150,1130,(h-8)/3), vy7=v=>lerp(540,150,v/11);
const demand=h=>.8+5.7*smooth((h-8.95)/.1)*Math.exp(-Math.max(0,h-9.1)/.45);

 draw(t){
   txt('Monday, 09:00',640,105,{size:46,p:P(t,.2,1.5)});
   const L=[["Arrivals faster than service → the queue grows without limit.",2.1],
            ["Near full capacity, waiting explodes. Leave headroom.",7.6],
            ["A load balancer spreads requests and skips unhealthy copies.",12.1],
            ["Copies are only interchangeable if the API is stateless.",19.1]];
   L.forEach(([s,t0],i)=>{ const y=225+i*95;
     txt(String(i+1),150,y,{size:40,color:C.blue,alpha:P(t,t0,.6)});
     txt(s,205,y,{size:25,align:'left',p:P(t,t0+.2,1.6)}); });
   txt('Go deeper',640,622,{size:16,font:MONO,color:C.grey,alpha:P(t,24.2,1)});
   txt('Is someone waiting? · A plan for failure · Serving many users at once',640,655,{size:18,font:MONO,color:C.yellow,alpha:P(t,24.8,1)});
 }}
];

/* ======================================================================
   EXPLORE: run the service desk (live)
   ====================================================================== */
const $=id=>document.getElementById(id);
let exRate=3, exCopies=2, exHC=true, exCrash=false;
const exSim=new Sim({seed:1,max:6,mu:2,lambda:()=>exRate,copies:()=>exCopies,up:(t,k)=>!(k===0&&exCrash),tLB:.9,tSrv:.7,hcOn:()=>exHC,hcInt:2});
function setCopies(n){
  const t=exSim.t; exCopies=n;
  for(let k=n;k<exSim.srv.length;k++){ const s=exSim.srv[k];
    if(s.cur){ s.cur.ph='out'; s.cur.t0=t; s.cur.k=Math.min(k,n-1); s.cur=null; }
    const moved=[...s.q]; s.q=[]; moved.forEach(r=>exSim.reroute(r,k,t)); s.healthy=true; }
}
function renderExplore(dt){
  exSim.advanceTo(exSim.t+Math.min(dt,.1));
  const L=layoutFor(exCopies); drawSim(exSim,L,1);
  const healthy=exSim.srv.slice(0,exCopies).filter((s,k)=>exHC?s.healthy:exSim.up(exSim.t,k)).length;
  const cap=healthy*2, util=cap>0?exRate/cap:Infinity;
  const recent=exSim.waits.filter(([tt])=>tt>exSim.t-10), avg=recent.length?recent.reduce((a,[,w])=>a+w,0)/recent.length:0;
  const col=util>=1?C.red:util>.85?C.orange:C.green;
  txt(`arrivals ${exRate.toFixed(1)}/s  ·  capacity ${cap.toFixed(1)}/s  ·  busy ${util===Infinity?'∞':Math.round(util*100)+'%'}  ·  waiting ${exSim.waitingCount()}  ·  avg wait (10 s) ${avg.toFixed(1)} s`,640,40,{size:16,font:MONO,color:col});
  if(util>=1) txt(cap===0?'no healthy copy: in production, tickets should go to a human fallback queue':'over capacity: the queue will grow without limit',640,72,{size:16,style:'italic',color:C.red});
  else if(util>.85) txt('close to the limit: waits climb steeply',640,72,{size:16,style:'italic',color:C.orange});
  if(exCrash&&!exHC) txt('health checks off: the load balancer keeps sending to the crashed copy',640,100,{size:15,style:'italic',color:C.red});
  graph(exSim,140,612,1000,96,exSim.t-30,exSim.t,30,1,'waiting · last 30 seconds');
}

/* ======================================================================
   PLAYER
   ====================================================================== */
const START=[]; let TOTAL=0; S.forEach(s=>{START.push(TOTAL); TOTAL+=s.dur;});
let T=0, playing=false, lastTs=null, voiceOn=false, capKey=null, explore=false, frameDt=0;
const capEl=$('cap'), fillEl=$('fill'), timeEl=$('time'), playBtn=$('play'), bigPlay=$('bigplay'), voiceBtn=$('voice'), exBtn=$('exploreBtn');
S.forEach((s,i)=>{
  if(i>0){ const tk=document.createElement('div'); tk.className='tick'; tk.style.left=(START[i]/TOTAL*100)+'%'; $('bar').appendChild(tk); }
  const b=document.createElement('button'); b.textContent=`${i+1} · ${s.title}`;
  b.onclick=()=>{ setExplore(false); seek(START[i]+.001); if(!playing) setPlaying(true); };
  $('chapters').appendChild(b);
});
const chapBtns=[...$('chapters').children];
const locate=time=>{ for(let i=S.length-1;i>=0;i--) if(time>=START[i]) return {i,lt:Math.min(time-START[i],S[i].dur)}; return {i:0,lt:0}; };
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
/* ---------- NARRATOR: every word is spoken before the video moves on ---------- */
const SAY=[[/“|”|"/g,''],[/TF-IDF/g,'T F I D F'],[/\b2xx\b/g,'two hundreds'],[/\b4xx\b/g,'four hundreds'],[/\b5xx\b/g,'five hundreds'],
  [/HUMAN_REVIEW/g,'human review'],[/\bFINANCE\b/g,'Finance'],[/\bESTATES\b/g,'Estates'],[/\bIT\b/g,'I T'],[/\bHR\b/g,'H R'],
  [/\bCCIO\b/g,'C C I O'],[/(\d{2}):(\d{2})/g,(m,h,mi)=>`${+h} ${mi==='00'?"o'clock":mi}`],[/7f3a/g,'7 F 3 A'],[/\//g,' slash ']];
const NAR={u:null,speaking:false,until:0,voice:null,list:[]};
const HOLDS=[]; S.forEach((s,i)=>{ s.caps.forEach((c,k)=>{ if(k>0) HOLDS.push(START[i]+c[0]-.02); }); HOLDS.push(START[i]+s.dur-.6); }); HOLDS.sort((a,b)=>a-b);
const vSel=document.createElement('select'); vSel.title='Narrator voice';
vSel.style.cssText='background:#16161a;border:1px solid #2a2a30;color:#ddd;border-radius:8px;height:38px;padding:0 8px;font-family:inherit;font-size:13px;max-width:200px';
voiceBtn.after(vSel);
const vNorm=l=>(l||'').replace('_','-');
const vRank=v=>{ const l=vNorm(v.lang); return /^en-GB/i.test(l)?0:/^en-US/i.test(l)?1:/^en/i.test(l)?2:9; };
const vGood=v=>/natural|online|google|neural|premium|enhanced/i.test(v.name)?1:0;
const vName=v=>v.name.replace(/^(Microsoft|Google|Apple) /,'').replace(/\s*-\s*English.*$/,'').slice(0,34);
function pickVoices(){
  if(!('speechSynthesis' in window)) return;
  const vs=speechSynthesis.getVoices().filter(v=>vRank(v)<9).sort((a,b)=>vRank(a)-vRank(b)||vGood(b)-vGood(a));
  if(!vs.length) return;
  NAR.list=vs; vSel.innerHTML='';
  const label={0:'🇬🇧 UK English',1:'🇺🇸 US English',2:'Other English'}; let g=null, og=null;
  vs.forEach((v,i)=>{
    const r=vRank(v);
    if(r!==g){ g=r; og=document.createElement('optgroup'); og.label=label[r]; vSel.appendChild(og); }
    const o=document.createElement('option'); o.value=i; o.textContent=vName(v)+' · '+vNorm(v.lang); og.appendChild(o);
  });
  if(!vs.some(v=>vRank(v)===0)){
    const og2=document.createElement('optgroup'); og2.label='No UK voice on this device';
    const o=document.createElement('option'); o.value='help'; o.textContent='➕ How to add a UK English voice'; og2.appendChild(o); vSel.appendChild(og2);
  }
  const cur=NAR.voice?vs.findIndex(v=>v.name===NAR.voice.name):-1, i=cur>=0?cur:0;
  vSel.value=String(i); NAR.voice=vs[i];
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=pickVoices; pickVoices(); [300,1200,3500].forEach(ms=>setTimeout(pickVoices,ms)); }
else vSel.style.display='none';
vSel.onchange=()=>{
  if(vSel.value==='help'){
    capEl.textContent='To add a UK voice — Windows: Settings → Time & language → Speech → Add voices → English (United Kingdom). Mac: System Settings → Accessibility → Spoken Content → System voice → Manage Voices → English (UK). Or open this page in Microsoft Edge or Google Chrome, which include free UK voices. Then reload the page.';
    vSel.value=String(Math.max(0,NAR.list.indexOf(NAR.voice))); return;
  }
  NAR.voice=NAR.list[+vSel.value]; stopVoice(); capKey=null;
};
function speak(s){
  if(!voiceOn||!playing||!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const text=SAY.reduce((a,[r,v])=>a.replace(r,v),s);
  const u=new SpeechSynthesisUtterance(text);
  if(NAR.voice){ u.voice=NAR.voice; u.lang=NAR.voice.lang; } else u.lang='en-GB';
  u.rate=1;
  NAR.u=u; NAR.speaking=true; NAR.until=performance.now()+(text.split(/\s+/).length/2+4)*1000;
  u.onend=u.onerror=()=>{ if(NAR.u===u) NAR.speaking=false; };
  setTimeout(()=>{ if(NAR.u===u) speechSynthesis.speak(u); },80);
}
function stopVoice(){ NAR.speaking=false; NAR.u=null; if('speechSynthesis' in window) speechSynthesis.cancel(); }
function narrating(){ if(!NAR.speaking) return false; if(performance.now()>NAR.until){ NAR.speaking=false; return false; } return true; }
function updateCaption(i,lt){
  const caps=S[i].caps; let ci=0; caps.forEach((c,k)=>{ if(lt>=c[0]) ci=k; });
  const key=i+'-'+ci; if(key!==capKey){ capKey=key; capEl.textContent=caps[ci][1]; speak(caps[ci][1]); }
}
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.globalAlpha=1; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  if(explore){ renderExplore(frameDt); return; }
  const {i,lt}=locate(T), s=S[i], last=i===S.length-1;
  ctx.globalAlpha=Math.min(P(lt,0,.45), last?1:1-P(lt,s.dur-.55,.55));
  s.draw(lt); ctx.globalAlpha=1;
  txt(`${i+1} · ${s.title}`,40,38,{size:15,color:'#555',align:'left',font:MONO});
  updateCaption(i,lt);
  fillEl.style.width=(T/TOTAL*100)+'%'; timeEl.textContent=`${fmt(T)} / ${fmt(TOTAL)}`;
  chapBtns.forEach((b,k)=>b.classList.toggle('active',k===i));
}
function setPlaying(v){
  playing=v; playBtn.textContent=v?'❚❚':'▶';
  if(v){ setExplore(false); bigPlay.style.display='none'; if(T>=TOTAL) seek(0); capKey=null; } else stopVoice();
}
function seek(time){ T=clamp(time,0,TOTAL); capKey=null; stopVoice(); }
function setExplore(v){
  if(explore===v) return; explore=v; exBtn.classList.toggle('on',v); $('explorePanel').classList.toggle('show',v);
  if(v){ if(playing) setPlaying(false); bigPlay.style.display='none';
    capEl.textContent='Change the arrival rate and the number of copies. Crash a copy, then switch health checks off and see what happens.'; }
  else capKey=null;
}
function frame(ts){
  frameDt=lastTs!=null?(ts-lastTs)/1000:0;
  if(playing){
    let dt=Math.min(frameDt,.1);
    if(voiceOn&&narrating()){ const h=HOLDS.find(x=>x>=T-1e-6); if(h!==undefined&&T+dt>=h) dt=Math.max(0,h-T); }
    T+=dt;
    if(T>=TOTAL){ T=TOTAL; if(!(voiceOn&&narrating())){ setPlaying(false); bigPlay.style.display='block'; bigPlay.textContent='↺'; } }
  }
  lastTs=ts; render(); requestAnimationFrame(frame);
}
cv.addEventListener('pointerdown',()=>{ if(!explore) setPlaying(!playing); });
playBtn.onclick=()=>setPlaying(!playing);
bigPlay.onclick=()=>setPlaying(true);
$('restart').onclick=()=>{ seek(0); setPlaying(true); };
voiceBtn.onclick=()=>{ voiceOn=!voiceOn; voiceBtn.textContent=voiceOn?'🔊 Voice on':'🔈 Voice off'; voiceBtn.classList.toggle('on',voiceOn); if(!voiceOn) stopVoice(); else capKey=null; };
exBtn.onclick=()=>setExplore(!explore);
$('exRate').oninput=e=>{ exRate=parseFloat(e.target.value); $('exRateV').textContent=exRate.toFixed(1); };
$('exCopies').oninput=e=>{ setCopies(parseInt(e.target.value)); $('exCopiesV').textContent=exCopies; };
$('exHC').onchange=e=>{ exHC=e.target.checked; };
$('exCrash').onclick=()=>{ exCrash=!exCrash; $('exCrash').textContent=exCrash?'🔧 Recover copy 1':'💥 Crash copy 1'; $('exCrash').classList.toggle('on',exCrash); };
$('exReset').onclick=()=>{ exSim.reset(); exCrash=false; $('exCrash').textContent='💥 Crash copy 1'; $('exCrash').classList.remove('on'); };
$('bar').onclick=e=>{ setExplore(false); const r=$('bar').getBoundingClientRect(); seek((e.clientX-r.left)/r.width*TOTAL); };
document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT'].includes(e.target.tagName)) return;
  if(e.code==='Space'){ e.preventDefault(); setPlaying(!playing); }
  if(e.code==='ArrowRight'){ const {i}=locate(T); if(i<S.length-1) seek(START[i+1]+.001); }
  if(e.code==='ArrowLeft'){ const {i,lt}=locate(T); seek(START[lt<1.5&&i>0?i-1:i]+.001); }
});
requestAnimationFrame(frame);
</script>
</body>
</html>
