<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=1280, H=720; let dpr=1;
function resize(){ dpr=Math.min(window.devicePixelRatio||1,2); cv.width=W*dpr; cv.height=H*dpr; }
resize(); addEventListener('resize', resize);

const C={white:'#ECECEC',grey:'#7d7d7d',dim:'#444',blue:'#58C4DD',yellow:'#F7D96F',green:'#83C167',red:'#FC6255',teal:'#5CD0B3',purple:'#B189C6',orange:'#FF9A4D'};
const SERIF='Georgia, "Times New Roman", serif', MONO='Consolas, "SFMono-Regular", "Liberation Mono", monospace';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const smooth=x=>{x=clamp(x);return x*x*(3-2*x);};
const P=(t,s,d)=>smooth((t-s)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
const codeCol=c=>c[0]==='2'?C.green:c[0]==='4'?C.orange:C.red;

/* ---------- drawing helpers ---------- */
const fontStr=(size,font,style)=>[style,size+'px',font].filter(Boolean).join(' ');
function tw(s,size,font=SERIF,style=''){ctx.save();ctx.font=fontStr(size,font,style);const w=ctx.measureText(s).width;ctx.restore();return w;}
function txt(s,x,y,o={}){
  const {size=28,color=C.white,align='center',alpha=1,font=SERIF,style='',p=1}=o;
  if(alpha<=0||p<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.font=fontStr(size,font,style); ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='middle';
  if(p<1){ const w=ctx.measureText(s).width, x0=align==='center'?x-w/2:align==='right'?x-w:x; ctx.beginPath(); ctx.rect(x0-4,y-size,(w+8)*p,size*2); ctx.clip(); }
  ctx.fillText(s,x,y); ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function box(x,y,w,h,o={}){
  const {stroke=C.white,fill=null,alpha=1,lw=2,r=10,p=1,dash=null}=o; if(alpha<=0||p<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; rr(x,y,w,h,r); if(fill){ctx.fillStyle=fill;ctx.fill();}
  const L=2*(w+h); if(p<1) ctx.setLineDash([L*p,L]); else if(dash) ctx.setLineDash(dash);
  ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.stroke(); ctx.restore();
}
function seg(x1,y1,x2,y2,o={}){
  const {color=C.white,lw=2,alpha=1,p=1,dash=null}=o; if(p<=0||alpha<=0) return;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineCap='round'; if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(lerp(x1,x2,p),lerp(y1,y2,p)); ctx.stroke(); ctx.restore();
}
function arrow(x1,y1,x2,y2,o={}){
  const {color=C.white,p=1,alpha=1,lw=2.5,head=12}=o; if(p<=0||alpha<=0) return;
  seg(x1,y1,x2,y2,{color,lw,alpha,p});
  const x=lerp(x1,x2,p), y=lerp(y1,y2,p), a=Math.atan2(y2-y1,x2-x1);
  ctx.save(); ctx.globalAlpha*=alpha; ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(x,y);
  ctx.lineTo(x-head*Math.cos(a-.4),y-head*Math.sin(a-.4)); ctx.lineTo(x-head*Math.cos(a+.4),y-head*Math.sin(a+.4)); ctx.closePath(); ctx.fill(); ctx.restore();
}
function ring(x,y,r,color,alpha=1,lw=2){ if(alpha<=0) return; ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke(); ctx.restore(); }
function jsonBox(lines,cx,cy,alpha,color=C.white){
  const size=18, lh=27, w=Math.max(...lines.map(l=>tw(l,size,MONO)))+44, h=lines.length*lh+26, bx=cx-w/2, by=cy-h/2;
  const g={bx,by,w,h,x0:bx+22,ly:i=>by+13+lh/2+i*lh};
  if(alpha<=0) return g;
  box(bx,by,w,h,{stroke:'#3a3a42',fill:'rgba(255,255,255,0.035)',alpha});
  lines.forEach((l,i)=>txt(l,g.x0,g.ly(i),{size,font:MONO,align:'left',color,alpha}));
  return g;
}
function chip(x,y,code,col,a,sub=''){
  if(a<=0) return;
  box(x-40,y-20,80,40,{stroke:col,fill:'rgba(0,0,0,.92)',alpha:a});
  txt(code,x,y,{size:22,font:MONO,color:col,alpha:a});
  if(sub) txt(sub,x,y+34,{size:13,color:C.grey,alpha:a,style:'italic'});
}
function illustrative(){ txt('illustrative numbers',1250,700,{size:13,color:'#4a4a4a',align:'right',font:MONO}); }

/* ---------- the checkpoint pipeline ---------- */
const PY=330, GX=[300,455,610,765,920], ST=[110,...GX,1140], HOP=.42;
const GATES=[
  {q:'address known?',code:'404',sub:'not found'},
  {q:'who are you?',code:'401',sub:'not authenticated'},
  {q:'too many?',code:'429',sub:'slow down'},
  {q:'data valid?',code:'422',sub:'failed validation'},
  {q:'model ready?',code:'503',sub:'try again later'}];
const arr=(t0,stop)=>t0+HOP*(stop+1);
const gateFlash=(t,ta)=>t>=ta?1-P(t,ta+.8,.5):0;

function pipeline(o={}){
  const {a=1,gA=[1,1,1,1,1],lab=[1,1,1,1,1],flash=[0,0,0,0,0],rule=0,modelGlow=0}=o;
  if(a<=0) return;
  box(40,PY-45,140,90,{stroke:C.blue,alpha:a});
  txt('Staff portal',110,PY-8,{size:18,alpha:a});
  txt('client',110,PY+20,{size:14,style:'italic',color:C.grey,alpha:a});
  box(225,PY-150,1020,312,{stroke:'#3a3a44',alpha:a,dash:[8,6]});
  txt('inside the API (server)',245,PY-132,{size:14,font:MONO,color:C.grey,align:'left',alpha:a});
  seg(180,PY,1070,PY,{color:'#2a2a30',lw:2,alpha:a});
  box(1070,PY-40,140,80,{stroke:modelGlow>0?C.yellow:C.teal,lw:2+modelGlow*2,alpha:a});
  txt('model',1140,PY,{size:18,alpha:a});
  GX.forEach((gx,g)=>{
    const ga=a*gA[g]; if(ga<=0) return;
    const col=flash[g]>0.02?C.red:'#8a8a8a';
    seg(gx,PY-78,gx,PY-24,{color:col,lw:5,alpha:ga}); seg(gx,PY+24,gx,PY+78,{color:col,lw:5,alpha:ga});
    if(flash[g]>0) ring(gx,PY,32,C.red,ga*flash[g],2);
    txt(GATES[g].q,gx,PY-100,{size:16,style:'italic',alpha:a*lab[g]});
  });
  txt('rule: message must not be empty',GX[3],PY-124,{size:13,font:MONO,color:C.yellow,alpha:a*rule});
}
function packet(x,y,col,a,label){
  box(x-26,y-16,52,32,{stroke:col,fill:'rgba(0,0,0,.92)',alpha:a,r:6,lw:2.5});
  txt('{ }',x,y,{size:15,font:MONO,color:col,alpha:a});
  if(label) txt(label,x,y-32,{size:13,font:MONO,color:C.grey,alpha:a});
}
function runPacket(t,t0,stop,o={}){
  const {label='',col=null}=o; if(t<t0) return;
  const j=stop+1, ta=arr(t0,stop), fail=stop<5;
  let x, c=C.white, a=1;
  if(t<ta){ const f=(t-t0)/HOP, k=Math.floor(f); x=lerp(ST[k],ST[k+1],smooth(f-k)); }
  else {
    c=fail?(col||C.red):C.green; const hold=fail?.5:.6, back=fail?.9:1.2;
    if(t<ta+hold) x=ST[j];
    else if(t<ta+hold+back) x=lerp(ST[j],ST[0],smooth((t-ta-hold)/back));
    else { x=ST[0]; a=1-P(t,ta+hold+back,.35); }
  }
  if(a>0) packet(x,PY,c,a,label);
}

/* ======================================================================
   SCENES
   ====================================================================== */
const S=[
/* 1 ─ The waiter */
{title:'The waiter',dur:24,
 caps:[[0,"The model works in a notebook on someone's laptop. How does the staff portal actually use it?"],
       [6.8,"Think of a restaurant. The customer never walks into the kitchen."],
       [11.5,"They order from a menu, through a waiter, and get a plate back."],
       [16.8,"An API is that waiter: an agreed way for one program to ask another to do something."]],
 draw(t){
   txt('SECTION · APIs FROM ABSOLUTE BASICS',640,60,{size:15,font:MONO,color:C.yellow,alpha:P(t,.2,.8)*(1-P(t,5.5,.6))});
   const aA=P(t,.3,.8)*(1-P(t,6.3,.6));
   box(260,300,240,90,{stroke:C.blue,alpha:aA}); txt('Staff portal',380,345,{size:22,alpha:aA});
   box(780,300,240,90,{stroke:C.teal,alpha:aA}); txt('ML model',900,333,{size:22,alpha:aA});
   txt('in a notebook, on a laptop',900,362,{size:15,style:'italic',color:C.grey,alpha:aA});
   txt('?',640,345,{size:56,color:C.yellow,alpha:aA*P(t,1.5,.6)});
   const B=P(t,6.8,.8);
   const top=[['Customer','asks',220],['Waiter','takes the order',640],['Kitchen','does the work',1060]];
   top.forEach(([n,d,x],i)=>{ const a=B*P(t,7+i*.4,.6);
     box(x-100,160,200,90,{stroke:i===1?C.yellow:C.white,alpha:a}); txt(n,x,195,{size:24,alpha:a}); txt(d,x,226,{size:15,style:'italic',color:C.grey,alpha:a}); });
   txt('✗ never walks into the kitchen',640,122,{size:18,style:'italic',color:C.red,alpha:P(t,8.4,.6)});
   arrow(320,190,540,190,{color:C.yellow,p:P(t,11.6,.7)}); arrow(740,190,960,190,{color:C.yellow,p:P(t,12.3,.7)});
   txt('order',430,174,{size:15,font:MONO,color:C.yellow,alpha:P(t,11.8,.5)});
   arrow(960,226,740,226,{color:C.green,p:P(t,13.4,.7)}); arrow(540,226,320,226,{color:C.green,p:P(t,14.1,.7)});
   txt('plate',430,244,{size:15,font:MONO,color:C.green,alpha:P(t,14.2,.5)});
   box(560,268,160,46,{stroke:C.yellow,alpha:P(t,11.6,.6),r:6});
   txt('MENU',640,284,{size:15,font:MONO,color:C.yellow,alpha:P(t,11.6,.6)});
   txt('what you may ask for',640,302,{size:12,style:'italic',color:C.grey,alpha:P(t,11.6,.6)});
   const bot=[['Staff portal',220,C.blue],['API',640,C.yellow],['ML model',1060,C.teal]];
   bot.forEach(([n,x,col],i)=>{ const a=P(t,17+i*.4,.6);
     seg(x,i===1?318:254,x,436,{color:'#555',lw:1.5,dash:[5,6],alpha:a});
     box(x-100,440,200,80,{stroke:col,lw:i===1?3:2,alpha:a}); txt(n,x,480,{size:24,alpha:a}); });
   arrow(320,465,540,465,{color:C.yellow,p:P(t,18.4,.7)}); arrow(740,465,960,465,{color:C.yellow,p:P(t,18.8,.7)});
   arrow(960,498,740,498,{color:C.green,p:P(t,19.4,.7)}); arrow(540,498,320,498,{color:C.green,p:P(t,19.8,.7)});
   txt('request',430,449,{size:14,font:MONO,color:C.yellow,alpha:P(t,18.6,.5)});
   txt('response',430,516,{size:14,font:MONO,color:C.green,alpha:P(t,20,.5)});
   txt('API · Application Programming Interface',640,600,{size:26,color:C.yellow,p:P(t,20.3,1.5)});
   txt('the menu = what you may ask for, and how to ask',640,640,{size:19,style:'italic',color:C.grey,alpha:P(t,21.5,.8)});
 }},

/* 2 ─ Request and response */
{title:'Request & response',dur:26.5,
 caps:[[0,"In software, the one who asks is the client. The one who answers is the server."],
       [6.5,"The question is a request. It goes to an address called an endpoint: POST /predictions."],
       [12.5,"The answer is a response, written in JSON."],
       [16,"JSON is a bundle of named values. Text goes in quotes. Numbers don't. True and false mean yes or no."],
       [23,"Readable by people, and easy for software."]],
 draw(t){
   const a1=P(t,.3,.8), a2=P(t,1.5,.8);
   box(60,250,240,120,{stroke:C.blue,alpha:a1}); txt('Staff portal',180,295,{size:22,alpha:a1}); txt('client · asks',180,330,{size:16,style:'italic',color:C.grey,alpha:a1});
   box(980,250,240,120,{stroke:C.teal,alpha:a2}); txt('Routing service',1100,295,{size:22,alpha:a2}); txt('server · answers',1100,330,{size:16,style:'italic',color:C.grey,alpha:a2});
   const ea=P(t,6.6,.6);
   box(995,212,210,32,{stroke:C.yellow,fill:'rgba(0,0,0,.9)',alpha:ea,r:6}); txt('POST /predictions',1100,228,{size:16,font:MONO,color:C.yellow,alpha:ea});
   txt('endpoint',1100,190,{size:14,style:'italic',color:C.grey,alpha:ea});
   arrow(305,285,975,285,{color:C.yellow,p:P(t,7.2,1.2)});
   txt('request',640,268,{size:15,font:MONO,color:C.yellow,alpha:P(t,7.6,.5)});
   jsonBox(['{','  "message": "My overtime payment is missing"','}'],640,160,P(t,8,.8));
   arrow(975,342,305,342,{color:C.green,p:P(t,12.6,1.2)});
   txt('response',640,360,{size:15,font:MONO,color:C.green,alpha:P(t,13,.5)});
   const RESP=['{','  "team": "FINANCE",','  "confidence": 0.91,','  "human_review": false','}'];
   const g=jsonBox(RESP,560,530,P(t,13.4,.8),C.white);
   const an=(line,prefix,token,label,col,s)=>{
     const a=P(t,s,.6); if(a<=0) return;
     const x1=g.x0+tw(prefix,18,MONO), w=tw(token,18,MONO), y=g.ly(line);
     seg(x1,y+13,x1+w,y+13,{color:col,lw:2.5,alpha:a});
     const ex=g.bx+g.w+30;
     seg(x1+w+6,y,ex-8,y,{color:col,lw:1,alpha:a*.6,dash:[3,4]});
     txt(label,ex,y,{size:17,color:col,align:'left',alpha:a,style:'italic'});
   };
   an(1,'  "team": ','"FINANCE"','text goes in quotes',C.yellow,16.4);
   an(2,'  "confidence": ','0.91','numbers have no quotes',C.blue,18.2);
   an(3,'  "human_review": ','false','yes or no: true / false',C.green,20);
   const ka=P(t,21,.6);
   seg(g.x0+tw('  ',18,MONO),g.ly(1)+13,g.x0+tw('  "team"',18,MONO),g.ly(1)+13,{color:C.purple,lw:2.5,alpha:ka});
   txt('key = a name, like a column heading',g.bx-24,g.ly(1),{size:16,style:'italic',color:C.purple,align:'right',alpha:ka});
   txt('{ }  one object',g.bx-24,g.ly(0),{size:16,style:'italic',color:C.grey,align:'right',alpha:P(t,16.2,.6)});
 }},

/* 3 ─ HTTP, API, REST */
{title:'HTTP · API · REST',dur:30,
 caps:[[0,"Four words beginners mix up: HTTP, API, REST and RESTful."],
       [4.5,"HTTP is the postal service: the rules for carrying a message across the web."],
       [10,"The API is what you are allowed to ask for, and how: the menu."],
       [15.5,"REST is one style of designing that menu. Organise it around nouns, called resources, and use standard verbs."],
       [23,"An API that follows these rules is RESTful. Sending JSON alone does not make it RESTful."]],
 draw(t){
   const ha=P(t,4.6,.8);
   txt('HTTP · the postal service',330,108,{size:26,color:C.white,p:P(t,4.6,1.2)});
   box(60,150,540,320,{stroke:C.white,alpha:ha,p:ha});
   seg(60,150,330,200,{color:C.white,lw:1.5,alpha:ha*.35}); seg(600,150,330,200,{color:C.white,lw:1.5,alpha:ha*.35});
   const L=[['POST /predictions HTTP/1.1',C.yellow,240],['Host: harbourside-router.azurewebsites.net',C.blue,272],

const $=id=>document.getElementById(id);
let exRes=null, exT0=0;
const RESULTS={
  '404':['Not found: there is no such endpoint.','Client: fix the address. Retrying will not help.'],
  '401':['Not authenticated: the API key is missing or wrong.','Client: send the correct key in the X-API-Key header.'],
  '403':['Forbidden: we know who you are, but this key may not do this.','Client: use a key with the right permission.'],
  '429':['Too many requests: slow down.','Client: wait, then retry more slowly.'],
  '422':['Unprocessable: understood, but the data failed validation.','Client: fix the body before sending again.'],
  '503':['Unavailable: the model is not ready.','Client: try again later, or send the ticket to the human queue.'],
  '200':['OK: here is your answer  →  FINANCE · 0.91','Every checkpoint passed.'],
  '200!':['OK (!): valid shape, useless content  →  HUMAN_REVIEW','Turn on the empty-message rule to catch this with 422.']
};
function evaluate(){
  const e=$('exEndpoint').value, k=$('exKey').value, b=$('exBody').value, burst=$('exBurst').checked, down=$('exDown').checked, rule=$('exRule').checked;
  const label=b==='ok'?'msg':b==='empty'?'""':'{ }';
  if(e!=='/predictions') return {stop:0,code:'404',label:e};
  if(k==='missing'||k==='wrong') return {stop:1,code:'401',label:k==='missing'?'no key':'bad key'};
  if(k==='readonly') return {stop:1,code:'403',label:'read-only'};
  if(burst) return {stop:2,code:'429',label:'×5000'};
  if(b==='none'||(b==='empty'&&rule)) return {stop:3,code:'422',label};
  if(down) return {stop:4,code:'503',label};
  return {stop:5,code:'200',warn:b==='empty',label};
}
function renderExplore(){

  if(!exRes){ txt('Which checkpoint will stop it? Guess first, then send.',640,600,{size:22,style:'italic',color:C.grey}); return; }
  const {stop,code,warn,label}=exRes, col=warn?C.yellow:codeCol(code);
  runPacket(t,0,stop,{label,col:codeCol(code)});
  const tc=stop<5?arr(0,stop)+.1:arr(0,5)+1.8, ca=P(t,tc,.3);
  if(stop<5) chip(GX[stop],PY+112,code,col,ca); else chip(110,PY+112,code,col,ca);
  const [title,todo]=RESULTS[warn?'200!':code], ra=P(t,tc+.2,.4);

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.globalAlpha=1; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  if(explore){ renderExplore(); return; }
  const {i,lt}=locate(T), s=S[i], last=i===S.length-1;
  ctx.globalAlpha=Math.min(P(lt,0,.45), last?1:1-P(lt,s.dur-.55,.55));
  s.draw(lt); ctx.globalAlpha=1;
  txt(`${i+1} · ${s.title}`,40,38,{size:15,color:'#555',align:'left',font:MONO});
  updateCaption(i,lt);
  fillEl.style.width=(T/TOTAL*100)+'%'; timeEl.textContent=`${fmt(T)} / ${fmt(TOTAL)}`;
  chapBtns.forEach((b,k)=>b.classList.toggle('active',k===i));
}
function setPlaying(v){
  playing=v; playBtn.textContent=v?'❚❚':'▶';
  if(v){ setExplore(false); bigPlay.style.display='none'; if(T>=TOTAL) seek(0); capKey=null; } else stopVoice();
}
function seek(time){ T=clamp(time,0,TOTAL); capKey=null; stopVoice(); }
function setExplore(v){
  if(explore===v) return; explore=v; exBtn.classList.toggle('on',v); $('explorePanel').classList.toggle('show',v);
  if(v){ if(playing) setPlaying(false); bigPlay.style.display='none'; exRes=null;
    capEl.textContent='Build a request: choose the endpoint, key and body, switch on any problems, then press Send.'; }
  else capKey=null;
}
function frame(ts){
  if(playing){
    let dt=lastTs!=null?Math.min((ts-lastTs)/1000,.1):0;
    if(voiceOn&&narrating()){ const h=HOLDS.find(x=>x>=T-1e-6); if(h!==undefined&&T+dt>=h) dt=Math.max(0,h-T); }
    T+=dt;
    if(T>=TOTAL){ T=TOTAL; if(!(voiceOn&&narrating())){ setPlaying(false); bigPlay.style.display='block'; bigPlay.textContent='↺'; } }
  }
  lastTs=ts; render(); requestAnimationFrame(frame);
}
cv.addEventListener('pointerdown',()=>{ if(!explore) setPlaying(!playing); });
playBtn.onclick=()=>setPlaying(!playing);
bigPlay.onclick=()=>setPlaying(true);
$('restart').onclick=()=>{ seek(0); setPlaying(true); };
voiceBtn.onclick=()=>{ voiceOn=!voiceOn; voiceBtn.textContent=voiceOn?'🔊 Voice on':'🔈 Voice off'; voiceBtn.classList.toggle('on',voiceOn); if(!voiceOn) stopVoice(); else capKey=null; };
exBtn.onclick=()=>setExplore(!explore);
$('exSend').onclick=()=>{ exRes=evaluate(); exT0=performance.now()/1000;
  capEl.textContent='Watch which checkpoint stops it. Then change one option and send again.'; };
$('bar').onclick=e=>{ setExplore(false); const r=$('bar').getBoundingClientRect(); seek((e.clientX-r.left)/r.width*TOTAL); };
document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT'].includes(e.target.tagName)) return;
  if(e.code==='Space'){ e.preventDefault(); setPlaying(!playing); }
  if(e.code==='ArrowRight'){ const {i}=locate(T); if(i<S.length-1) seek(START[i+1]+.001); }
  if(e.code==='ArrowLeft'){ const {i,lt}=locate(T); seek(START[lt<1.5&&i>0?i-1:i]+.001); }
});
requestAnimationFrame(frame);
</script>
</body>
</html>
